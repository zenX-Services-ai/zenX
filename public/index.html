<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080812">
<title>ZenX AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#070711;
  --panel:rgba(18,18,34,.82);
  --border:rgba(255,255,255,.11);
  --text:#fff;
  --muted:#9999ad;
  --purple:#8b5cf6;
  --cyan:#06b6d4;
  --pink:#ec4899;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{
  background:
    radial-gradient(circle at 5% 10%,rgba(139,92,246,.28),transparent 30%),
    radial-gradient(circle at 95% 10%,rgba(6,182,212,.20),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(236,72,153,.18),transparent 35%),
    #070711;
}

body:before{
  content:"";
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  background:linear-gradient(135deg,#8b5cf6,#06b6d4,#ec4899);
  filter:blur(120px);
  opacity:.13;
  animation:float 14s ease-in-out infinite alternate;
  pointer-events:none;
}

@keyframes float{
  from{transform:translate(-100px,-100px)}
  to{transform:translate(calc(100vw - 300px),calc(100vh - 350px))}
}

.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}

/* ================= AUTH ================= */

#auth{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth-card{
  width:min(430px,100%);
  padding:32px;
  border:1px solid var(--border);
  border-radius:28px;
  background:rgba(17,17,30,.80);
  backdrop-filter:blur(25px);
  box-shadow:0 30px 100px rgba(0,0,0,.45);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:26px;
  font-weight:850;
  margin-bottom:28px;
}

.brand-icon,.mini-logo{
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#8b5cf6,#06b6d4,#ec4899);
  box-shadow:0 0 35px rgba(139,92,246,.35);
}

.brand-icon{
  width:46px;
  height:46px;
  border-radius:15px;
}

.auth-card h1{
  font-size:30px;
  margin-bottom:7px;
}

.auth-sub{
  color:var(--muted);
  margin-bottom:23px;
}

.field{
  margin:13px 0;
}

.field label{
  display:block;
  color:#bdbdcc;
  font-size:13px;
  margin-bottom:7px;
}

.field input{
  width:100%;
  padding:14px 15px;
  border-radius:13px;
  border:1px solid var(--border);
  outline:none;
  background:rgba(255,255,255,.05);
  color:#fff;
}

.field input:focus{
  border-color:#8b5cf6;
  box-shadow:0 0 0 3px rgba(139,92,246,.10);
}

.primary{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:0;
  border-radius:14px;
  color:#fff;
  font-weight:800;
  background:linear-gradient(135deg,#8b5cf6,#06b6d4);
  transition:.2s;
}

.primary:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 30px rgba(139,92,246,.25);
}

.primary:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.forgot{
  width:100%;
  margin-top:11px;
  border:0;
  background:none;
  color:#b9a5ff;
  font-size:13px;
}

.switch{
  text-align:center;
  margin-top:18px;
  color:#8f8fa3;
  font-size:14px;
}

.switch button{
  border:0;
  background:none;
  color:#c4b5fd;
  font-weight:750;
}

.auth-msg{
  margin-top:15px;
  padding:12px;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  color:#d5d5e2;
  font-size:13px;
  line-height:1.55;
}

/* ================= APP ================= */

.app{
  width:100%;
  height:100%;
  display:flex;
}

.sidebar{
  width:270px;
  height:100%;
  padding:18px;
  display:flex;
  flex-direction:column;
  background:rgba(6,6,17,.68);
  backdrop-filter:blur(25px);
  border-right:1px solid var(--border);
  z-index:50;
}

.logo-row{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:21px;
  font-weight:850;
  margin-bottom:22px;
}

.mini-logo{
  width:38px;
  height:38px;
  border-radius:12px;
}

.new-chat{
  width:100%;
  padding:12px;
  border-radius:13px;
  color:#fff;
  border:1px solid var(--border);
  background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(6,182,212,.12));
  font-weight:750;
}

.history-title{
  margin:24px 0 9px;
  color:#737387;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.history{
  flex:1;
  overflow-y:auto;
}

.chat-item{
  padding:11px;
  margin-bottom:4px;
  border-radius:10px;
  color:#c7c7d5;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-item:hover{
  background:rgba(255,255,255,.07);
}

.user-box{
  display:flex;
  align-items:center;
  gap:9px;
  border-top:1px solid var(--border);
  padding-top:14px;
}

.user-avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#ec4899,#8b5cf6);
  font-weight:800;
}

.user-info{
  min-width:0;
}

.user-name{
  font-size:14px;
}

.user-email{
  color:#77778a;
  font-size:11px;
  max-width:150px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.logout{
  margin-left:auto;
  background:none;
  border:0;
  color:#999;
  font-size:18px;
}

/* ================= MAIN ================= */

.main{
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:70px;
  flex:0 0 70px;
  padding:0 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(7,7,17,.48);
  backdrop-filter:blur(22px);
  border-bottom:1px solid var(--border);
}

.top-left{
  display:flex;
  align-items:center;
  gap:11px;
}

.menu{
  display:none;
  border:0;
  background:none;
  color:#fff;
  font-size:23px;
}

.model{
  font-weight:800;
  font-size:17px;
}

.online{
  color:#70dfa0;
  font-size:11px;
  display:flex;
  align-items:center;
  gap:5px;
}

.online-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 10px #22c55e;
}

.mode{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(255,255,255,.045);
  color:#ddd;
  font-size:12px;
}

.mode input{
  accent-color:#8b5cf6;
}

/* ================= CHAT ================= */

.chat{
  flex:1;
  overflow-y:auto;
  padding:32px 18px 160px;
  scroll-behavior:smooth;
}

.messages{
  max-width:900px;
  margin:auto;
}

.welcome{
  min-height:55vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.orb{
  width:92px;
  height:92px;
  border-radius:30px;
  display:grid;
  place-items:center;
  font-size:39px;
  background:linear-gradient(135deg,#8b5cf6,#06b6d4,#ec4899);
  box-shadow:0 0 55px rgba(139,92,246,.30);
  animation:pulse 3s ease-in-out infinite;
}

@keyframes pulse{
  50%{transform:translateY(-7px) rotate(2deg)}
}

.welcome h1{
  margin-top:25px;
  font-size:clamp(32px,6vw,56px);
  background:linear-gradient(90deg,#fff,#c4b5fd,#67e8f9,#f9a8d4);
  -webkit-background-clip:text;
  color:transparent;
}

.welcome p{
  max-width:560px;
  margin-top:9px;
  color:#858598;
}

.message{
  display:flex;
  gap:12px;
  margin:27px 0;
  animation:appear .2s ease;
}

@keyframes appear{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:none}
}

.message.user{
  justify-content:flex-end;
}

.message.user .bubble{
  max-width:76%;
  background:linear-gradient(135deg,rgba(124,58,237,.92),rgba(79,70,229,.82));
}

.message.ai .bubble{
  max-width:88%;
  background:rgba(255,255,255,.045);
  border:1px solid var(--border);
}

.msg-avatar{
  flex:0 0 35px;
  height:35px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#8b5cf6,#06b6d4);
}

.bubble{
  padding:15px 17px;
  border-radius:18px;
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message-image{
  max-width:280px;
  max-height:220px;
  margin-top:9px;
  border-radius:14px;
  display:block;
}

.actions{
  display:flex;
  gap:4px;
  margin-top:6px;
}

.action{
  padding:4px 6px;
  border:0;
  background:none;
  color:#77778c;
  font-size:12px;
}

.action:hover{
  color:#fff;
}

/* ================= COMPOSER ================= */

.composer-wrap{
  position:fixed;
  left:270px;
  right:0;
  bottom:0;
  padding:13px 18px 18px;
  background:linear-gradient(transparent,rgba(7,7,17,.97) 35%);
  z-index:40;
}

.composer{
  max-width:900px;
  margin:auto;
  padding:9px;
  border-radius:23px;
  border:1px solid rgba(255,255,255,.13);
  background:rgba(18,18,33,.90);
  backdrop-filter:blur(25px);
  box-shadow:0 15px 55px rgba(0,0,0,.42);
}

.tools{
  display:flex;
  gap:7px;
  padding:2px 3px 8px;
}

.tool{
  padding:7px 10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.045);
  color:#ccc;
  font-size:12px;
}

.tool.active{
  color:#fff;
  border-color:rgba(139,92,246,.65);
  background:rgba(139,92,246,.22);
}

.input-row{
  display:flex;
  gap:8px;
  align-items:flex-end;
}

.icon-btn{
  width:45px;
  height:45px;
  flex:0 0 45px;
  border-radius:14px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.05);
  color:#fff;
  font-size:18px;
}

.send{
  border:0;
  background:linear-gradient(135deg,#8b5cf6,#06b6d4);
}

textarea{
  flex:1;
  min-height:47px;
  max-height:150px;
  resize:none;
  outline:none;
  border:0;
  background:transparent;
  color:#fff;
  padding:13px 8px;
  font-size:16px;
  line-height:1.4;
}

textarea::placeholder{
  color:#6e6e82;
}

input[type=file]{
  display:none;
}

.preview{
  display:none;
  padding:3px 3px 8px;
  align-items:center;
}

.preview img{
  width:90px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
}

.preview button{
  border:0;
  background:none;
  color:#aaa;
  margin-left:7px;
}

.tip{
  text-align:center;
  color:#505062;
  font-size:10px;
  margin-top:6px;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

  .sidebar{
    position:fixed;
    left:-285px;
    top:0;
    bottom:0;
    transition:.25s;
  }

  .sidebar.open{
    left:0;
  }

  .menu{
    display:block;
  }

  .composer-wrap{
    left:0;
    padding:9px;
  }

  .chat{
    padding-left:9px;
    padding-right:9px;
  }

  .message.user .bubble,
  .message.ai .bubble{
    max-width:91%;
  }

  .tool span{
    display:none;
  }

  .mode{
    font-size:11px;
    padding:7px 9px;
  }

  .welcome h1{
    font-size:34px;
  }
}
</style>
</head>

<body>

<!-- =====================================================
     AUTH SCREEN
===================================================== -->

<section id="auth">

  <div class="auth-card">

    <div class="brand">
      <div class="brand-icon">✦</div>
      ZenX
    </div>

    <h1 id="authTitle">Welcome back</h1>

    <div class="auth-sub" id="authSub">
      Sign in to continue to ZenX AI.
    </div>

    <div class="field hidden" id="nameField">
      <label>Name</label>
      <input id="name" type="text" placeholder="Your name">
    </div>

    <div class="field">
      <label>Email</label>
      <input id="email" type="email" placeholder="you@example.com">
    </div>

    <div class="field" id="passwordField">
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••">
    </div>

    <button class="primary" id="authBtn" onclick="handleAuth()">
      Sign In
    </button>

    <button class="forgot" id="forgotBtn" onclick="showForgotPassword()">
      Forgot password?
    </button>

    <div class="switch">
      <span id="switchText">Don't have an account?</span>
      <button id="switchBtn" onclick="toggleAuth()">Sign Up</button>
    </div>

    <div class="auth-msg hidden" id="authMsg"></div>

  </div>

</section>


<!-- =====================================================
     MAIN APP
===================================================== -->

<section id="app" class="app hidden">

  <aside class="sidebar" id="sidebar">

    <div class="logo-row">
      <div class="mini-logo">✦</div>
      ZenX
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ New Chat
    </button>

    <div class="history-title">
      Recent Chats
    </div>

    <div class="history" id="history"></div>

    <div class="user-box">

      <div class="user-avatar" id="userAvatar">
        Z
      </div>

      <div class="user-info">
        <div class="user-name" id="userName">
          ZenX User
        </div>

        <div class="user-email" id="userEmail"></div>
      </div>

      <button class="logout" onclick="logout()">
        ↪
      </button>

    </div>

  </aside>


  <main class="main">

    <header class="topbar">

      <div class="top-left">

        <button class="menu" onclick="toggleSidebar()">
          ☰
        </button>

        <div>

          <div class="model">
            ZenX AI
          </div>

          <div class="online">
            <span class="online-dot"></span>
            Online
          </div>

        </div>

      </div>

      <label class="mode">
        🧠 Working Mode
        <input type="checkbox" id="workingMode">
      </label>

    </header>


    <section class="chat" id="chat">

      <div class="messages" id="messages"></div>

    </section>

  </main>

</section>


<!-- =====================================================
     COMPOSER
===================================================== -->

<div class="composer-wrap hidden" id="composerWrap">

  <div class="composer">

    <div class="preview" id="preview">

      <img id="previewImg">

      <button onclick="clearImage()">
        ✕
      </button>

    </div>


    <div class="tools">

      <button class="tool" id="workTool" onclick="toggleWorking()">
        🧠 <span>Working Mode</span>
      </button>

      <label class="tool">
        🖼️ <span>Image</span>
        <input
          type="file"
          id="imageInput"
          accept="image/*"
        >
      </label>

      <button class="tool" onclick="imageGeneration()">
        🎨 <span>Generate</span>
      </button>

    </div>


    <div class="input-row">

      <button
        class="icon-btn"
        onclick="document.getElementById('imageInput').click()"
      >
        ＋
      </button>

      <textarea
        id="prompt"
        rows="1"
        placeholder="Message ZenX..."
        oninput="resizeInput(this)"
        onkeydown="handleKey(event)"
      ></textarea>

      <button
        class="icon-btn"
        id="micBtn"
        onclick="voiceInput()"
      >
        🎙️
      </button>

      <button
        class="icon-btn send"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>

  </div>

  <div class="tip">
    ZenX may make mistakes. Check important information.
  </div>

</div>


<script>

/* =====================================================
   ZENX CONFIG
===================================================== */

const SUPABASE_URL =
"https://srlftvbiqoufejhhfsrh.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNybGZ0dmJpcW91ZmVqaGhmc3JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1OTI0NzAsImV4cCI6MjEwNDE2ODQ3MH0.vJ1CQ-Zz_kaRhDDT5J7y1nssgqccd2zPxQ4_FrJI4fs";

const API_URL =
"https://zenx-hnkl.onrender.com/api/ask";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let signupMode = false;
let forgotMode = false;
let workingMode = false;
let selectedImage = null;
let messages = [];


/* =====================================================
   START
===================================================== */

document.addEventListener("DOMContentLoaded", async () => {

  document
    .getElementById("imageInput")
    .addEventListener("change", handleImage);

  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      if(event === "PASSWORD_RECOVERY"){
        showResetPassword();
        return;
      }

      if(session && session.user){
        await openApp(session.user);
      }
    }
  );

  const {
    data:{session}
  } =
  await supabaseClient.auth.getSession();

  if(session && session.user){
    await openApp(session.user);
  }else{
    showAuth();
  }

});


/* =====================================================
   AUTH MODE
===================================================== */

function toggleAuth(){

  signupMode = !signupMode;
  forgotMode = false;

  document
    .getElementById("nameField")
    .classList.toggle(
      "hidden",
      !signupMode
    );

  document
    .getElementById("passwordField")
    .classList.remove("hidden");

  document
    .getElementById("password")
    .classList.remove("hidden");

  document.getElementById("authTitle")
    .textContent =
      signupMode
      ? "Create your account"
      : "Welcome back";

  document.getElementById("authSub")
    .textContent =
      signupMode
      ? "Create your ZenX AI account."
      : "Sign in to continue to ZenX AI.";

  document.getElementById("authBtn")
    .textContent =
      signupMode
      ? "Create Account"
      : "Sign In";

  document.getElementById("authBtn")
    .onclick = handleAuth;

  document.getElementById("switchText")
    .textContent =
      signupMode
      ? "Already have an account?"
      : "Don't have an account?";

  document.getElementById("switchBtn")
    .textContent =
      signupMode
      ? "Sign In"
      : "Sign Up";

  document.getElementById("switchBtn")
    .onclick = toggleAuth;

  document.getElementById("forgotBtn")
    .style.display =
      signupMode ? "none" : "block";

  clearAuthMessage();
}


/* =====================================================
   LOGIN / SIGNUP
===================================================== */

async function handleAuth(){

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  const name =
    document.getElementById("name")
      .value.trim();

  if(!email){
    showAuthMessage(
      "Please enter your email."
    );
    return;
  }

  if(!password){
    showAuthMessage(
      "Please enter your password."
    );
    return;
  }

  if(password.length < 6){
    showAuthMessage(
      "Password must be at least 6 characters."
    );
    return;
  }

  const btn =
    document.getElementById("authBtn");

  btn.disabled = true;
  btn.textContent = "Please wait...";

  try{

    if(signupMode){

      const {
        data,
        error
      } =
      await supabaseClient.auth.signUp({

        email:email,

        password:password,

        options:{
          data:{
            name:name || "ZenX User"
          },

          emailRedirectTo:
            window.location.origin
        }

      });

      if(error) throw error;

      if(data.session){

        await openApp(data.user);

      }else{

        showAuthMessage(
          "Account created successfully! 📩\n\n" +
          "Verification email check karo. " +
          "Email verify karne ke baad Sign In karo."
        );
      }

    }else{

      const {
        data,
        error
      } =
      await supabaseClient.auth
        .signInWithPassword({

          email:email,
          password:password

        });

      if(error) throw error;

      await openApp(data.user);
    }

  }catch(error){

    console.error(error);

    showAuthMessage(
      friendlyError(error.message)
    );

  }finally{

    btn.disabled = false;

    btn.textContent =
      signupMode
      ? "Create Account"
      : "Sign In";
  }
}


/* =====================================================
   FORGOT PASSWORD
===================================================== */

function showForgotPassword(){

  forgotMode = true;

  document
    .getElementById("nameField")
    .classList.add("hidden");

  document
    .getElementById("passwordField")
    .classList.add("hidden");

  document
    .getElementById("authTitle")

    return;

  const btn =
    document.getElementById("authBtn");

  btn.disabled = true;

  try{

    const {
      error
    } =
    await supabaseClient.auth
      .updateUser({

    if(error) throw error;

    showAuthMessage(
      "✅ Password updated successfully!"

/* =====================================================
   CHAT STORAGE
===================================================== */

function getStorageKey(){

  const user =
    supabaseClient.auth
      .getSession;

  return "zenx_chat_history";
}


function saveMessages(){

  try{

    localStorage.setItem(
      getStorageKey(),
      JSON.stringify(messages)
    );

  }catch(error){

    console.error(error);
  }
}


function loadMessages(){

  try{

    const saved =
      localStorage.getItem(
        getStorageKey()
      );

    messages =
      saved
      ? JSON.parse(saved)
      : [];

  }catch(error){

    messages = [];
  }

  renderMessages();
  updateHistory();
}


/* =====================================================
   NEW CHAT
===================================================== */

function newChat(){

  messages = [];

  saveMessages();

  renderMessages();

  updateHistory();

  document
    .getElementById("prompt")
    .focus();
}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
  role,
  text,
  image=null
){

  const id =
    Date.now() + "_" +
    Math.random();

  messages.push({
    id:id,
    role:role,
    text:text,
    image:image
  });

  saveMessages();
  renderMessages();
  updateHistory();

  return id;
}


/* =====================================================
   UPDATE MESSAGE
===================================================== */

function updateMessage(id,text){

  const item =
    messages.find(
      message => message.id === id
    );

  if(item){
    item.text = text;
  }

  saveMessages();
  renderMessages();
}


/* =====================================================
   RENDER CHAT
===================================================== */

function renderMessages(){

  const container =
    document.getElementById("messages");

  if(!messages.length){

    container.innerHTML = `
      <div class="welcome">
        <div class="orb">✦</div>

        <h1>
          What can I help you with?
        </h1>

        <p>
          Ask anything, solve problems,
          analyze images and work with ZenX AI.
        </p>
      </div>
    `;

    return;
  }

  container.innerHTML = "";

  messages.forEach(message => {

    const row =
      document.createElement("div");

    row.className =
      "message " +
      (
        message.role === "user"
        ? "user"
        : "ai"
      );

    const avatar =
      document.createElement("div");

    avatar.className =
      "msg-avatar";

    avatar.textContent =
      message.role === "user"
      ? "👤"
      : "✦";

    const content =
      document.createElement("div");

    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    bubble.textContent =
      message.text || "";

    content.appendChild(bubble);

    if(message.image){

      const img =
        document.createElement("img");

      img.src = message.image;

      img.className =
        "message-image";

      content.appendChild(img);
    }

    if(message.role === "ai"){

      const actions =
        document.createElement("div");

      actions.className =
        "actions";

      actions.innerHTML = `
        <button class="action"
          onclick="copyAnswer(this)">
          Copy
        </button>

        <button class="action"
          onclick="readAnswer(this)">
          🔊
        </button>

        <button class="action"
          onclick="regenerateAnswer(this)">
          ↻ Regenerate
        </button>
      `;

      content.appendChild(actions);
    }

    row.appendChild(avatar);
    row.appendChild(content);

    container.appendChild(row);
  });

  setTimeout(() => {

    const chat =
      document.getElementById("chat");

    chat.scrollTop =
      chat.scrollHeight;

  },30);
}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const input =
    document.getElementById("prompt");

  const question =
    input.value.trim();

  if(!question && !selectedImage){
    return;
  }

  const image =
    selectedImage;

  const userText =
    question ||
    "Please analyze this image.";

  addMessage(
    "user",
    userText,
    image
  );

  input.value = "";

  resizeInput(input);

  clearImage();

  const loadingId =
    addMessage(
      "ai",
      "ZenX is thinking…"
    );

  try{

    let finalQuestion =
      question;

    if(workingMode){

      finalQuestion =
        "WORKING MODE: Solve this carefully step-by-step. " +
        "Give a clear and useful answer.\n\n" +
        question;
    }

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "accept":"application/json",
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            question:finalQuestion
          })
        }
      );

    if(!response.ok){

      throw new Error(
        "Backend returned " +
        response.status
      );
    }

    const data =
      await response.json();

    const answer =
      data.answer ??
      data.response ??
      data.result ??
      data.message ??
      JSON.stringify(
        data,
        null,
        2
      );

    updateMessage(
      loadingId,
      String(answer)
    );

  }catch(error){

    console.error(error);

    updateMessage(
      loadingId,
      "⚠️ ZenX backend se response nahi aa raha.\n\n" +
      "Render API check karo aur dobara try karo."
    );
  }
}

/* =====================================================
   VOICE INPUT
===================================================== */

function voiceInput(){

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!Recognition){

    alert(
      "Voice recognition is not supported in this browser."
    );

    return;
  }

  const recognition =
    new Recognition();

  recognition.lang =
    "en-IN";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  const mic =
    document.getElementById("micBtn");

  mic.textContent =
    "🔴";

  recognition.start();

  recognition.onresult =
    event => {

      const text =
        event.results[0][0]
          .transcript;

      const input =
        document.getElementById("prompt");

      input.value =
        text;

      resizeInput(input);
    };

  recognition.onerror =
    () => {

      mic.textContent =
        "🎙️";
    };

  recognition.onend =
    () => {

      mic.textContent =
        "🎙️";
    };
}


/* =====================================================
   VOICE OUTPUT
===================================================== */

function readAnswer(button){

  const bubble =
    button
      .parentElement
      .parentElement
      .querySelector(".bubble");

  if(!bubble) return;

  speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(
      bubble.innerText
    );

  speech.lang =
    "en-IN";

  speechSynthesis.speak(speech);
}


/* =====================================================
   IMAGE UPLOAD
===================================================== */

function handleImage(event){

  const file =
    event.target.files[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){

    alert(
      "Please select an image."
    );

    return;
  }

  const reader =
    new FileReader();

  reader.onload =
    event => {

      selectedImage =
        event.target.result;

      document
        .getElementById("previewImg")
        .src =
          selectedImage;

      document
        .getElementById("preview")
        .style.display =
          "flex";
    };

  reader.readAsDataURL(file);
}


function clearImage(){

  selectedImage =
    null;

  document
    .getElementById("preview")
    .style.display =
      "none";

  document
    .getElementById("previewImg")
    .src = "";

  document
    .getElementById("imageInput")
    .value = "";
}


/* =====================================================
   IMAGE GENERATION UI
===================================================== */

async function imageGeneration(){

  const input =
    document.getElementById("prompt");

  const prompt =
    input.value.trim();

  if(!prompt){

    input.focus();

    input.placeholder =
      "Example: A futuristic city at night...";

    return;
  }

  // Show user's image request
  addMessage(
    "user",
    "🎨 Generate image: " + prompt
  );

  input.value = "";
  resizeInput(input);

  // Loading message
  const loadingId =
    addMessage(
      "ai",
      "🎨 ZenX is creating your image…"
    );

  try{

    const response =
      await fetch(
        IMAGE_API_URL,
        {
          method:"POST",

          headers:{
            "accept":"application/json",
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            prompt:prompt
          })
        }
      );

    if(!response.ok){

      throw new Error(
        "Image API returned " +
        response.status
      );
    }

    const data =
      await response.json();

    if(data.error){

      throw new Error(data.error);
    }

    if(!data.image){

      throw new Error(
        "No image received from ZenX API."
      );
    }

    // Replace loading message with generated image
    const item =
      messages.find(
        message => message.id === loadingId
      );

    if(item){

      item.text =
        "✨ Image generated successfully!";

      item.image =
        data.image;
    }

    saveMessages();
    renderMessages();
    updateHistory();

  }catch(error){

    console.error(
      "Image generation error:",
      error
    );

    updateMessage(
      loadingId,
      "⚠️ Image generate nahi ho payi.\n\n" +
      error.message
    );
  }
}


/* =====================================================
   COPY
===================================================== */

function copyAnswer(button){

  const bubble =
    button
      .parentElement
      .parentElement
      .querySelector(".bubble");

  if(!bubble) return;

  navigator.clipboard
    .writeText(
      bubble.innerText
    )
    .then(() => {

      const old =
        button.innerText;

      button.innerText =
        "Copied ✓";

      setTimeout(() => {

        button.innerText =
          old;

      },1200);
    });
}


/* =====================================================
   REGENERATE
===================================================== */

function regenerateAnswer(button){

  const aiRow =
    button
      .parentElement
      .parentElement;

  const allAi =
    [...document.querySelectorAll(
      ".message.ai"
    )];

  const aiIndex =
    allAi.indexOf(aiRow);

  if(aiIndex < 0) return;

  let aiCount = -1;
  let userMessage = null;

  for(let i=0;i<messages.length;i++){

    if(messages[i].role === "ai"){

      aiCount++;

      if(aiCount === aiIndex){

        for(
          let j=i-1;
          j>=0;
          j--
        ){

          if(messages[j].role === "user"){

            userMessage =
              messages[j];

            break;
          }
        }

        break;
      }
    }
  }

  if(userMessage){

    document
      .getElementById("prompt")
      .value =
        userMessage.text;

    sendMessage();
  }
}


/* =====================================================
   KEYBOARD
===================================================== */

function handleKey(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();
  }
}


function resizeInput(element){

  element.style.height =
    "auto";

  element.style.height =
    Math.min(
      element.scrollHeight,
      150
    ) + "px";
}


/* =====================================================
   HISTORY
===================================================== */

function updateHistory(){

  const history =
    document.getElementById("history");

  history.innerHTML = "";

  messages
    .filter(
      message =>
        message.role === "user"
    )
    .slice(-10)
    .reverse()
    .forEach(message => {

      const item =
        document.createElement("div");

      item.className =
        "chat-item";

      item.textContent =
        message.text ||
        "Image conversation";

      history.appendChild(item);
    });
}

function toggleSidebar(){

/* =====================================================
   FRIENDLY ERRORS
===================================================== */

function friendlyError(message){

  const text =
    String(message || "");

  const lower =
    text.toLowerCase();

  if(
    lower.includes(
      "invalid login credentials"
    )
  ){

    return "❌ Email ya password incorrect hai.";
  }

  if(
    lower.includes(
      "email not confirmed"
    )
  ){

    return (
      "📩 Pehle email verify karo. " +
      "Verification email resend kar sakte ho."
    );
  }

  if(
    lower.includes(
      "user already registered"
    )
  ){

    return (
      "⚠️ Is email se account already bana hua hai. " +
      "Sign In karo."
    );
  }

  if(
    lower.includes(
      "rate limit"
    )
  ){

    return (
      "⏳ Too many attempts. " +
      "Thodi der baad try karo."
    );
  }

  return text ||
    "Something went wrong. Please try again.";
}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
