<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>ZenX AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#060611;color:#fff}
button,input,textarea{font:inherit}
button{cursor:pointer}

body{
 overflow:hidden;
 background:
 radial-gradient(circle at 10% 10%,rgba(124,58,237,.30),transparent 30%),
 radial-gradient(circle at 90% 15%,rgba(6,182,212,.22),transparent 28%),
 radial-gradient(circle at 50% 100%,rgba(236,72,153,.20),transparent 35%),
 #060611;
}

body:before{
 content:"";
 position:fixed;
 width:420px;height:420px;border-radius:50%;
 background:linear-gradient(135deg,#8b5cf6,#06b6d4,#ec4899);
 filter:blur(120px);opacity:.14;
 animation:float 14s infinite alternate ease-in-out;
 pointer-events:none;
}
@keyframes float{
 from{transform:translate(-100px,-80px)}
 to{transform:translate(calc(100vw - 300px),calc(100vh - 350px))}
}

.hidden{display:none!important}

/* AUTH */

.auth{
 width:100%;
 height:100%;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.authCard{
 width:min(430px,100%);
 padding:32px;
 border:1px solid rgba(255,255,255,.12);
 border-radius:28px;
 background:rgba(17,17,30,.76);
 backdrop-filter:blur(25px);
 box-shadow:0 30px 90px rgba(0,0,0,.4);
}

.brand{
 display:flex;
 align-items:center;
 gap:12px;
 font-size:25px;
 font-weight:850;
 margin-bottom:28px;
}

.logo{
 width:45px;height:45px;border-radius:15px;
 display:grid;place-items:center;
 background:linear-gradient(135deg,#8b5cf6,#06b6d4,#ec4899);
 box-shadow:0 0 35px rgba(139,92,246,.4);
}

.auth h1{font-size:30px;margin:0 0 8px}
.sub{color:#9696aa;margin-bottom:24px}

.field{margin:13px 0}
.field label{
 display:block;color:#b9b9c9;font-size:13px;margin-bottom:7px
}
.field input{
 width:100%;padding:14px 15px;border-radius:13px;
 border:1px solid rgba(255,255,255,.12);
 outline:none;background:rgba(255,255,255,.055);
 color:#fff;
}
.field input:focus{border-color:#8b5cf6}

.primary{
 width:100%;padding:14px;border:0;border-radius:14px;
 color:#fff;font-weight:800;
 background:linear-gradient(135deg,#8b5cf6,#06b6d4);
 margin-top:8px;
}

.switch{
 margin-top:18px;text-align:center;color:#9292a7;font-size:14px
}
.switch button{
 background:none;border:0;color:#bca8ff;font-weight:700
}
.authMsg{
 margin-top:15px;
 padding:11px;
 border-radius:12px;
 background:rgba(255,255,255,.05);
 color:#cfcfe0;
 font-size:13px;
 line-height:1.5;
}

/* APP */

.app{width:100%;height:100%;display:flex}

.sidebar{
 width:270px;
 height:100%;
 padding:18px;
 border-right:1px solid rgba(255,255,255,.09);
 background:rgba(6,6,17,.68);
 backdrop-filter:blur(25px);
 display:flex;
 flex-direction:column;
 z-index:20;
}

.logoRow{
 display:flex;align-items:center;gap:10px;
 font-weight:850;font-size:21px;margin-bottom:22px
}

.logoSmall{
 width:38px;height:38px;border-radius:12px;
 display:grid;place-items:center;
 background:linear-gradient(135deg,#8b5cf6,#06b6d4,#ec4899)
}

.newChat{
 width:100%;padding:12px;border-radius:13px;
 color:#fff;border:1px solid rgba(255,255,255,.12);
 background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(6,182,212,.12));
 font-weight:750;
}

.historyTitle{
 color:#737388;font-size:11px;
 text-transform:uppercase;letter-spacing:1px;
 margin:25px 0 9px
}
.history{overflow:auto;flex:1}
.chatItem{
 padding:11px;border-radius:10px;
 color:#c5c5d3;margin-bottom:4px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chatItem:hover{background:rgba(255,255,255,.07)}

.userBox{
 border-top:1px solid rgba(255,255,255,.09);
 padding-top:14px;
 display:flex;align-items:center;gap:10px;
}
.userAvatar{
 width:36px;height:36px;border-radius:50%;
 display:grid;place-items:center;
 background:linear-gradient(135deg,#ec4899,#8b5cf6);
 font-weight:800;
}
.userEmail{
 font-size:12px;color:#858597;
 max-width:150px;
 overflow:hidden;text-overflow:ellipsis
}
.logout{
 margin-left:auto;background:none;border:0;color:#999
}

/* MAIN */

.main{flex:1;min-width:0;display:flex;flex-direction:column}

.topbar{
 height:70px;
 border-bottom:1px solid rgba(255,255,255,.09);
 background:rgba(7,7,17,.48);
 backdrop-filter:blur(22px);
 display:flex;align-items:center;
 justify-content:space-between;
 padding:0 22px;
}

.topLeft{display:flex;align-items:center;gap:11px}
.menu{display:none;background:none;border:0;color:#fff;font-size:23px}

.model{font-weight:800;font-size:17px}
.online{
 color:#73e2a1;font-size:11px;
 display:flex;align-items:center;gap:5px
}
.onlineDot{
 width:7px;height:7px;border-radius:50%;
 background:#22c55e;box-shadow:0 0 10px #22c55e
}

.mode{
 display:flex;align-items:center;gap:8px;
 padding:8px 12px;border-radius:12px;
 border:1px solid rgba(255,255,255,.1);
 background:rgba(255,255,255,.045);
 color:#ddd;font-size:13px
}
.mode input{accent-color:#8b5cf6}

/* CHAT */

.chat{
 flex:1;overflow-y:auto;
 padding:35px 18px 160px;
 scroll-behavior:smooth
}
.messages{max-width:900px;margin:auto}

.welcome{
 min-height:55vh;
 display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 text-align:center
}
.orb{
 width:92px;height:92px;border-radius:29px;
 display:grid;place-items:center;font-size:38px;
 background:linear-gradient(135deg,#8b5cf6,#06b6d4,#ec4899);
 box-shadow:0 0 50px rgba(139,92,246,.32);
 animation:pulse 3s infinite ease-in-out
}
@keyframes pulse{50%{transform:translateY(-7px) rotate(2deg)}}

.welcome h1{
 margin:25px 0 8px;
 font-size:clamp(32px,6vw,57px);
 background:linear-gradient(90deg,#fff,#c4b5fd,#67e8f9,#f9a8d4);
 -webkit-background-clip:text;
 color:transparent
}
.welcome p{color:#89899e;max-width:560px}

.message{
 display:flex;gap:12px;margin:27px 0;
 animation:appear .22s ease
}
@keyframes appear{
 from{opacity:0;transform:translateY(7px)}
 to{opacity:1;transform:none}
}

.message.user{justify-content:flex-end}
.message.user .bubble{
 background:linear-gradient(135deg,rgba(124,58,237,.9),rgba(79,70,229,.82));
 max-width:76%
}
.message.ai .bubble{
 background:rgba(255,255,255,.045);
 border:1px solid rgba(255,255,255,.09);
 max-width:88%
}
.msgAvatar{
 flex:0 0 35px;height:35px;border-radius:11px;
 display:grid;place-items:center;
 background:linear-gradient(135deg,#8b5cf6,#06b6d4)
}
.bubble{
 padding:15px 17px;border-radius:18px;
 line-height:1.65;white-space:pre-wrap;
 overflow-wrap:anywhere
}
.actions{display:flex;gap:5px;margin-top:6px}
.action{
 background:none;border:0;color:#77778c;
 padding:4px 5px;font-size:12px
}
.action:hover{color:#fff}

.attached{
 max-width:280px;max-height:220px;
 border-radius:14px;margin-top:9px;
 display:block
}

/* COMPOSER */

.composerWrap{
 position:fixed;left:270px;right:0;bottom:0;
 padding:14px 18px 19px;
 background:linear-gradient(transparent,rgba(6,6,17,.96) 35%);
 z-index:10
}
.composer{
 max-width:900px;margin:auto;
 border:1px solid rgba(255,255,255,.13);
 border-radius:23px;
 background:rgba(18,18,33,.9);
 backdrop-filter:blur(25px);
 box-shadow:0 15px 50px rgba(0,0,0,.4);
 padding:9px
}
.tools{display:flex;gap:7px;padding:2px 3px 8px}
.tool{
 border:1px solid rgba(255,255,255,.1);
 background:rgba(255,255,255,.045);
 color:#ccc;border-radius:10px;
 padding:7px 10px;font-size:12px
}
.tool.active{
 background:rgba(139,92,246,.25);
 border-color:rgba(139,92,246,.65);
 color:#fff
}
.inputRow{display:flex;gap:8px;align-items:flex-end}
.iconBtn{
 width:45px;height:45px;border-radius:14px;
 border:1px solid rgba(255,255,255,.1);
 background:rgba(255,255,255,.05);
 color:#fff
}
.send{
 border:0;
 background:linear-gradient(135deg,#8b5cf6,#06b6d4)
}
textarea{
 flex:1;min-height:47px;max-height:150px;
 resize:none;outline:0;border:0;
 background:transparent;color:#fff;
 padding:13px 9px;font-size:16px
}
textarea::placeholder{color:#6f6f83}
input[type=file]{display:none}

.preview{
 padding:4px 4px 8px;
 display:none
}
.preview img{
 width:90px;height:70px;
 object-fit:cover;border-radius:10px
}
.preview button{
 background:none;border:0;color:#aaa;margin-left:5px
}
.tip{
 text-align:center;color:#555568;
 font-size:10px;margin-top:6px
}

/* MOBILE */

@media(max-width:800px){
 .sidebar{
   position:fixed;left:-285px;top:0;bottom:0;
   transition:.25s
 }
 .sidebar.open{left:0}
 .menu{display:block}
 .composerWrap{left:0;padding:9px}
 .chat{padding-left:9px;padding-right:9px}
 .message.user .bubble,.message.ai .bubble{max-width:91%}
 .tool span{display:none}
 .mode{font-size:11px;padding:7px}
 .welcome h1{font-size:34px}
}
</style>
</head>

<body>

<!-- AUTH -->
<section id="auth" class="auth">
 <div class="authCard">

  <div class="brand">
   <div class="logo">✦</div>
   ZenX
  </div>

  <h1 id="authTitle">Welcome back</h1>
  <div class="sub" id="authSub">
   Sign in to continue to ZenX AI.
  </div>

  <div id="nameField" class="field hidden">
   <label>Name</label>
   <input id="name" type="text" placeholder="Your name">
  </div>

  <div class="field">
   <label>Email</label>
   <input id="email" type="email" placeholder="you@example.com">
  </div>

  <div class="field">
   <label>Password</label>
   <input id="password" type="password" placeholder="••••••••">
  </div>

  <button class="primary" id="authBtn" onclick="handleAuth()">
   Sign In
  </button>

  <div class="switch">
   <span id="switchText">Don't have an account?</span>
   <button onclick="toggleAuth()" id="switchBtn">Sign Up</button>
  </div>

  <div id="authMsg" class="authMsg hidden"></div>
 </div>
</section>

<!-- APP -->
<section id="app" class="app hidden">

 <aside class="sidebar" id="sidebar">

  <div class="logoRow">
   <div class="logoSmall">✦</div>
   ZenX
  </div>

  <button class="newChat" onclick="newChat()">＋ New Chat</button>

  <div class="historyTitle">Recent chats</div>
  <div class="history" id="history"></div>

  <div class="userBox">
   <div class="userAvatar" id="userAvatar">Z</div>
   <div>
    <div id="userName">ZenX User</div>
    <div class="userEmail" id="userEmail"></div>
   </div>
   <button class="logout" onclick="logout()">↪</button>
  </div>

 </aside>

 <main class="main">

  <header class="topbar">

   <div class="topLeft">
    <button class="menu" onclick="toggleSidebar()">☰</button>

    <div>
     <div class="model">ZenX AI</div>
     <div class="online">
      <span class="onlineDot"></span>
      Online
     </div>
    </div>
   </div>

   <label class="mode">
    🧠 Working Mode
    <input type="checkbox" id="workingMode">
   </label>

  </header>

  <section class="chat" id="chat">
   <div class="messages" id="messages"></div>
  </section>

 </main>

</section>

<!-- COMPOSER -->
<div id="composerWrap" class="composerWrap hidden">

 <div class="composer">

  <div class="preview" id="preview">
   <img id="previewImg">
   <button onclick="clearImage()">✕</button>
  </div>

  <div class="tools">

   <button class="tool" id="workTool" onclick="toggleWorking()">
    🧠 <span>Working Mode</span>
   </button>

   <label class="tool">
    🖼️ <span>Image</span>
    <input type="file" id="imageInput" accept="image/*">
   </label>

   <button class="tool" onclick="imageGeneration()">
    🎨 <span>Generate</span>
   </button>

  </div>

  <div class="inputRow">

   <button class="iconBtn" onclick="document.getElementById('imageInput').click()">
    ＋
   </button>

   <textarea
    id="prompt"
    placeholder="Message ZenX..."
    rows="1"
    oninput="resizeInput(this)"
    onkeydown="keyHandler(event)"
   ></textarea>

   <button class="iconBtn" id="micBtn" onclick="voiceInput()">🎙️</button>

   <button class="iconBtn send" onclick="sendMessage()">➤</button>

  </div>

 </div>

 <div class="tip">
  ZenX may make mistakes. Check important information.
 </div>

</div>

<script>
/* ================================
   ZENX CONFIG
================================ */

const SUPABASE_URL =
"https://srlftvbiqoufejhhfsrh.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNybGZ0dmJpcW91ZmVqaGhmc3JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1OTI0NzAsImV4cCI6MjEwNDE2ODQ3MH0.vJ1CQ-Zz_kaRhDDT5J7y1nssgqccd2zPxQ4_FrJI4fs";

const API_URL =
"https://zenx-hnkl.onrender.com/api/ask";

const supabaseClient =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_ANON_KEY
);

let signupMode = false;
let workingMode = false;
let selectedImage = null;
let messages = [];

/* ================================
   START
================================ */

document.addEventListener("DOMContentLoaded", async () => {

 document
  .getElementById("imageInput")
  .addEventListener("change", imageSelected);

 supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

   if (session && session.user) {
    await openApp(session.user);
   } else {
    showAuth();
   }

  }
 );

 const {
  data:{session}
 } = await supabaseClient.auth.getSession();

 if (session && session.user) {
  await openApp(session.user);
 } else {
  showAuth();
 }
});

/* ================================
   AUTH
================================ */

function toggleAuth(){

 signupMode = !signupMode;

 document.getElementById("nameField")
  .classList.toggle("hidden",!signupMode);

 document.getElementById("authTitle").textContent =
  signupMode ? "Create your account" : "Welcome back";

 document.getElementById("authSub").textContent =
  signupMode
   ? "Create your ZenX AI account."
   : "Sign in to continue to ZenX AI.";

 document.getElementById("authBtn").textContent =
  signupMode ? "Create Account" : "Sign In";

 document.getElementById("switchText").textContent =
  signupMode
   ? "Already have an account?"
   : "Don't have an account?";

 document.getElementById("switchBtn").textContent =
  signupMode ? "Sign In" : "Sign Up";

 clearAuthMessage();
}

async function handleAuth(){

 const email =
  document.getElementById("email").value.trim();

 const password =
  document.getElementById("password").value;

 const name =
  document.getElementById("name").value.trim();

 if(!email || !password){
  authMessage("Email and password required.");
  return;
 }

 if(password.length < 6){
  authMessage("Password should be at least 6 characters.");
  return;
 }

 const btn = document.getElementById("authBtn");
 btn.disabled = true;
 btn.textContent = "Please wait...";

 try{

  if(signupMode){

   const {data,error} =
    await supabaseClient.auth.signUp({
     email,
     password,
     options:{
      data:{
       name:name || "ZenX User"
      },
      emailRedirectTo:window.location.origin
     }
    });

   if(error) throw error;

   if(data.session){
    await openApp(data.user);
   }else{
    authMessage(
     "Account created! 📩 Verification email bheja gaya hai. Email verify karke phir Sign In karo."
    );
   }

  }else{

   const {data,error} =
    await supabaseClient.auth.signInWithPassword({
     email,
     password
    });

   if(error) throw error;

   await openApp(data.user);
  }

 }catch(error){

  authMessage(error.message);

 }finally{

  btn.disabled = false;
  btn.textContent =
   signupMode ? "Create Account" : "Sign In";
 }
}

/* RESEND VERIFICATION */

async function resendVerification(){

 const email =
  document.getElementById("email").value.trim();

 if(!email){
  authMessage("Pehle email enter karo.");
  return;
 }

 try{

  const {error} =
   await supabaseClient.auth.resend({
    type:"signup",
    email,
    options:{
     emailRedirectTo:window.location.origin
    }
   });

  if(error) throw error;

  authMessage("Verification email dobara send ho gayi. 📩");

 }catch(error){
  authMessage(error.message);
 }
}

function authMessage(text){

 const box = document.getElementById("authMsg");

 box.innerHTML = `
  ${escapeHtml(text)}
  <br><br>
  <button
   onclick="resendVerification()"
   style="
    background:rgba(139,92,246,.2);
    color:white;
    border:1px solid rgba(139,92,246,.4);
    padding:7px 10px;
    border-radius:8px;
   "
  >
   Resend Verification
  </button>
 `;

 box.classList.remove("hidden");
}

function clearAuthMessage(){
 document.getElementById("authMsg").classList.add("hidden");
}

/* ================================
   APP
================================ */

async function openApp(user){

 document.getElementById("auth")
  .classList.add("hidden");

 document.getElementById("app")
  .classList.remove("hidden");

 document.getElementById("composerWrap")
  .classList.remove("hidden");

 const metadata = user.user_metadata || {};

 const displayName =
  metadata.name ||
  user.email?.split("@")[0] ||
  "ZenX User";

 document.getElementById("userName")
  .textContent = displayName;

 document.getElementById("userEmail")
  .textContent = user.email || "";

 document.getElementById("userAvatar")
  .textContent =
   displayName.charAt(0).toUpperCase();

 loadMessages();
}

function showAuth(){

 document.getElementById("auth")
  .classList.remove("hidden");

 document.getElementById("app")
  .classList.add("hidden");

 document.getElementById("composerWrap")
  .classList.add("hidden");
}

async function logout(){

 await supabaseClient.auth.signOut();

 messages=[];
}

/* ================================
   CHAT STORAGE
================================ */

function storageKey(){

 const user =
  supabaseClient.auth.getUser;

 return "zenx_chat_v1";
}

function saveMessages(){

 try{
  localStorage.setItem(
   storageKey(),
   JSON.stringify(messages)
  );
 }catch(e){}
}

function loadMessages(){

 try{

  const saved =
   localStorage.getItem(storageKey());

  messages =
   saved ? JSON.parse(saved) : [];

 }catch(e){
  messages=[];
 }

 renderMessages();
 updateHistory();
}

/* ================================
   CHAT
================================ */

function newChat(){

 messages=[];

 saveMessages();
 renderMessages();
 updateHistory();

 document.getElementById("prompt").focus();
}

function addMessage(role,text,image=null){

 const id =
  Date.now()+"_"+Math.random();

 messages.push({
  id,
  role,
  text,
  image
 });

 saveMessages();
 renderMessages();
 updateHistory();

 return id;
}

function updateMessage(id,text){

 const item =
  messages.find(x=>x.id===id);

 if(item){
  item.text=text;
 }

 saveMessages();
 renderMessages();
}

function renderMessages(){

 const box =
  document.getElementById("messages");

 if(!messages.length){

  box.innerHTML=`
   <div class="welcome">
    <div class="orb">✦</div>
    <h1>What can I help you with?</h1>
    <p>
     Ask questions, solve problems,
     analyze images and work with ZenX AI.
    </p>
   </div>
  `;

  return;
 }

 box.innerHTML="";

 messages.forEach(item=>{

  const row =
   document.createElement("div");

  row.className =
   "message " +
   (item.role==="user" ? "user":"ai");

  const avatar =
   document.createElement("div");

  avatar.className="msgAvatar";
  avatar.textContent =
   item.role==="user" ? "👤":"✦";

  const content =
   document.createElement("div");

  const bubble =
   document.createElement("div");

  bubble.className="bubble";
  bubble.textContent=item.text || "";

  content.appendChild(bubble);

  if(item.image){

   const img =
    document.createElement("img");

   img.className="attached";
   img.src=item.image;

   content.appendChild(img);
  }

  if(item.role==="ai"){

   const actions =
    document.createElement("div");

   actions.className="actions";

   actions.innerHTML=`
    <button class="action"
     onclick="copyAnswer(this)">Copy</button>

    <button class="action"
     onclick="readAnswer(this)">🔊</button>

    <button class="action"
     onclick="regenerate(this)">↻ Regenerate</button>
   `;

   content.appendChild(actions);
  }

  row.appendChild(avatar);
  row.appendChild(content);

  box.appendChild(row);
 });

 setTimeout(()=>{
  const chat=document.getElementById("chat");
  chat.scrollTop=chat.scrollHeight;
 },30);
}

async function sendMessage(){

 con
