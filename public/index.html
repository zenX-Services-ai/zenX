<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenX AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #08001c, #120052, #001b42);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #7c3aed, #22d3ee);
      -webkit-background-clip: text;
      color: transparent;
    }

    .tagline {
      text-align: center;
      color: #b9c0d0;
      margin-bottom: 25px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(18px);
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.25);
      color: white;
      outline: none;
    }

    input::placeholder {
      color: #9ca3af;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      color: white;
      background: linear-gradient(90deg, #7c3aed, #06b6d4);
      margin-top: 5px;
    }

    button:hover {
      opacity: .9;
    }

    .secondary {
      background: rgba(255,255,255,.1);
      margin-top: 12px;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      color: #b9c0d0;
    }

    .switch span {
      color: #22d3ee;
      cursor: pointer;
      font-weight: bold;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }

    .hidden {
      display: none !important;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .search-box input {
      margin: 0;
    }

    .search-box button {
      width: 110px;
      margin: 0;
    }

    .answer {
      margin-top: 22px;
      padding: 18px;
      background: rgba(0,0,0,.25);
      border-radius: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      min-height: 80px;
    }

    .logout {
      background: #ef4444;
      margin-top: 20px;
    }

    .small {
      color: #aab2c5;
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 18px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">ZenX</div>
  <div class="tagline">Your AI. Your Intelligence.</div>

  <!-- LOGIN -->
  <div id="loginScreen" class="card">
    <h2>Welcome Back</h2>

    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div class="switch">
      Don't have an account?
      <span onclick="showSignup()">Sign Up</span>
    </div>

    <div id="loginMessage" class="message"></div>
  </div>


  <!-- SIGNUP -->
  <div id="signupScreen" class="card hidden">
    <h2>Create Account</h2>

    <input id="signupEmail" type="email" placeholder="Email">
    <input id="signupPassword" type="password" placeholder="Password">

    <button onclick="signup()">Create Account</button>

    <div class="switch">
      Already have an account?
      <span onclick="showLogin()">Login</span>
    </div>

    <div id="signupMessage" class="message"></div>
  </div>


  <!-- VERIFICATION -->
  <div id="verifyScreen" class="card hidden">
    <h2>Verify Your Email</h2>

    <p class="small">
      Verification email bhej diya gaya hai.<br>
      Apne inbox/spam folder ko check karo.
    </p>

    <button onclick="resendVerification()">
      Resend Verification Email
    </button>

    <button class="secondary" onclick="showLogin()">
      Back to Login
    </button>

    <div id="verifyMessage" class="message"></div>
  </div>


  <!-- SEARCH -->
  <div id="searchScreen" class="card hidden">
    <h2>Ask ZenX AI</h2>

    <div class="search-box">
      <input id="question" type="text" placeholder="Ask anything...">
      <button onclick="askZenX()">Ask</button>
    </div>

    <div id="answer" class="answer">
      Your answer will appear here...
    </div>

    <button class="logout" onclick="logout()">Logout</button>
  </div>

</div>


<script>
  // ==============================
  // SUPABASE CONFIG
  // ==============================

  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

  const { createClient } = supabase;

  const client = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  // ==============================
  // SCREEN FUNCTIONS
  // ==============================

  function hideAllScreens() {
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("signupScreen").classList.add("hidden");
    document.getElementById("verifyScreen").classList.add("hidden");
    document.getElementById("searchScreen").classList.add("hidden");
  }

  function showLogin() {
    hideAllScreens();
    document.getElementById("loginScreen").classList.remove("hidden");
  }

  function showSignup() {
    hideAllScreens();
    document.getElementById("signupScreen").classList.remove("hidden");
  }

  function showVerify() {
    hideAllScreens();
    document.getElementById("verifyScreen").classList.remove("hidden");
  }

  function showSearch() {
    hideAllScreens();
    document.getElementById("searchScreen").classList.remove("hidden");
  }


  // ==============================
  // SIGNUP
  // ==============================

  async function signup() {

    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value;

    const message = document.getElementById("signupMessage");

    if (!email || !password) {
      message.textContent = "Email aur password enter karo.";
      return;
    }

    if (password.length < 6) {
      message.textContent = "Password minimum 6 characters ka hona chahiye.";
      return;
    }

    message.textContent = "Creating account...";

    const { data, error } = await client.auth.signUp({
      email: email,
      password: password,
      options: {
        emailRedirectTo: window.location.origin
      }
    });

    if (error) {
      message.textContent = error.message;
      return;
    }

    localStorage.setItem("zenxVerificationEmail", email);

    message.textContent = "";

    showVerify();
  }


  // ==============================
  // RESEND VERIFICATION
  // ==============================

  async function resendVerification() {

    const email =
      localStorage.getItem("zenxVerificationEmail") ||
      document.getElementById("signupEmail").value.trim();

    const message = document.getElementById("verifyMessage");

    if (!email) {
      message.textContent = "Email nahi mila. Dobara signup karo.";
      return;
    }

    message.textContent = "Sending verification email...";

    const { error } = await client.auth.resend({
      type: "signup",
      email: email,
      options: {
        emailRedirectTo: window.location.origin
      }
    });

    if (error) {
      message.textContent = error.message;
      return;
    }

    message.textContent =
      "Verification email dobara send ho gaya. Inbox/Spam check karo.";
  }


  // ==============================
  // LOGIN
  // ==============================

  async function login() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const message =
      document.getElementById("loginMessage");

    if (!email || !password) {
      message.textContent = "Email aur password enter karo.";
      return;
    }

    message.textContent = "Logging in...";

    const { data, error } =
      await client.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      message.textContent = error.message;
      return;
    }

    // Email verification check
    if (!data.user.email_confirmed_at) {
      localStorage.setItem(
        "zenxVerificationEmail",
        email
      );

      await client.auth.signOut();

      message.textContent =
        "Pehle email verify karo.";

      showVerify();
      return;
    }

    message.textContent = "";

    showSearch();
  }


  // ==============================
  // ASK ZENX BACKEND
  // ==============================

  async function askZenX() {

    const question =
      document.getElementById("question").value.trim();

    const answer =
      document.getElementById("answer");

    if (!question) {
      answer.textContent = "Question enter karo.";
      return;
    }

    answer.textContent = "ZenX is thinking...";

    try {

      const response = await fetch(
        "https://zenx-hnkl.onrender.com/api/ask",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "accept": "application/json"
          },

          body: JSON.stringify({
            question: question
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.detail || "Something went wrong."
        );
      }

      answer.textContent =
        data.answer ||
        data.response ||
        JSON.stringify(data);

    } catch (error) {

      answer.textContent =
        "Error: " + error.message;
    }
  }


  // ==============================
  // LOGOUT
  // ==============================

  async function logout() {

    await client.auth.signOut();

    document.getElementById("question").value = "";

    document.getElementById("answer").textContent =
      "Your answer will appear here...";

    showLogin();
  }


  // ==============================
  // CHECK EXISTING SESSION
  // ==============================

  async function checkSession() {

    const {
      data: { session }
    } = await client.auth.getSession();

    if (session && session.user) {

      if (session.user.email_confirmed_at) {
        showSearch();
      } else {
        await client.auth.signOut();
        showVerify();
      }

    } else {

      showLogin();
    }
  }


  // ==============================
  // AUTH STATE
  // ==============================

  client.auth.onAuthStateChange(
    async (event, session) => {

      if (event === "SIGNED_IN" && session) {

        if (session.user.email_confirmed_at) {
          showSearch();
        }
      }

      if (event === "SIGNED_OUT") {
        showLogin();
      }
    }
  );


  checkSession();

</script>

</body>
</html>
