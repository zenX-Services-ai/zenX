<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080812">
<title>ZenX AI — Student AI 2027</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#070711;
 --panel:#10101d;
 --panel2:#151526;
 --border:rgba(255,255,255,.09);
 --text:#f7f7ff;
 --muted:#9c9cb4;
 --purple:#8b5cf6;
 --cyan:#22d3ee;
 --pink:#ec4899;
 --danger:#ef4444;
}
body{
 font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:
 radial-gradient(circle at 20% 10%,rgba(139,92,246,.16),transparent 28%),
 radial-gradient(circle at 90% 80%,rgba(34,211,238,.10),transparent 25%),
 var(--bg);
 color:var(--text);
 min-height:100vh;
 overflow:hidden;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* AUTH */
#authScreen{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.auth-card{
 width:min(430px,100%);
 background:rgba(16,16,29,.88);
 backdrop-filter:blur(25px);
 border:1px solid var(--border);
 border-radius:25px;
 padding:30px;
 box-shadow:0 25px 80px rgba(0,0,0,.45);
}
.logo{
 font-size:34px;
 font-weight:900;
 text-align:center;
 letter-spacing:-2px;
 background:linear-gradient(90deg,var(--purple),var(--cyan),var(--pink));
 -webkit-background-clip:text;
 color:transparent;
}
.tagline{
 text-align:center;
 color:var(--muted);
 margin:8px 0 28px;
}
.auth-title{
 font-size:23px;
 margin-bottom:18px;
}
.field{margin-bottom:14px}
.field label{
 display:block;
 font-size:13px;
 color:var(--muted);
 margin-bottom:7px;
}
.field input{
 width:100%;
 background:#0b0b16;
 color:white;
 border:1px solid var(--border);
 padding:13px 14px;
 border-radius:12px;
 outline:none;
}
.field input:focus{border-color:var(--purple)}
.primary{
 width:100%;
 border:0;
 border-radius:12px;
 padding:13px;
 color:white;
 font-weight:700;
 background:linear-gradient(90deg,var(--purple),#6d4aff,var(--cyan));
 margin-top:4px;
}
.secondary{
 width:100%;
 background:transparent;
 color:#c7c7dc;
 border:1px solid var(--border);
 padding:11px;
 border-radius:11px;
 margin-top:10px;
}
.auth-links{
 display:flex;
 justify-content:space-between;
 margin-top:15px;
 font-size:13px;
}
.auth-links button{
 border:0;background:none;color:#a78bfa;
}
#authMsg{
 margin-top:12px;
 text-align:center;
 font-size:13px;
 min-height:18px;
 color:#fca5a5;
}

/* APP */
#app{
 display:flex;
 height:100vh;
}
.sidebar{
 width:275px;
 background:rgba(9,9,18,.94);
 border-right:1px solid var(--border);
 display:flex;
 flex-direction:column;
 padding:17px;
 flex-shrink:0;
}
.brand{
 display:flex;
 align-items:center;
 gap:10px;
 padding:5px 5px 18px;
}
.brand-icon{
 width:38px;height:38px;
 border-radius:12px;
 display:grid;
 place-items:center;
 background:linear-gradient(135deg,var(--purple),var(--cyan));
 font-weight:900;
}
.brand-name{font-weight:900;font-size:20px}
.version{
 margin-left:auto;
 font-size:10px;
 color:#9ca3af;
 border:1px solid var(--border);
 padding:3px 6px;
 border-radius:6px;
}
.new-chat{
 width:100%;
 border:1px solid rgba(139,92,246,.45);
 background:rgba(139,92,246,.12);
 color:white;
 padding:12px;
 border-radius:12px;
 font-weight:700;
 margin-bottom:18px;
}
.section-title{
 font-size:11px;
 text-transform:uppercase;
 letter-spacing:1px;
 color:#66667e;
 margin:8px 5px;
}
.recents{
 overflow:auto;
 flex:1;
}
.recent{
 display:flex;
 align-items:center;
 gap:8px;
 padding:10px;
 border-radius:10px;
 color:#c5c5d7;
 margin-bottom:4px;
 cursor:pointer;
 font-size:13px;
}
.recent:hover{background:rgba(255,255,255,.05)}
.recent-text{
 flex:1;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}
.delete-recent{
 border:0;
 background:none;
 color:#68687c;
 padding:3px;
}
.delete-recent:hover{color:#f87171}
.sidebar-bottom{
 border-top:1px solid var(--border);
 padding-top:14px;
}
.user-box{
 display:flex;
 align-items:center;
 gap:9px;
 padding:9px;
 margin-bottom:8px;
}
.avatar{
 width:34px;height:34px;
 border-radius:50%;
 display:grid;
 place-items:center;
 background:linear-gradient(135deg,#7c3aed,#06b6d4);
 font-weight:800;
}
.user-email{
 font-size:12px;
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap;
}
.small-btn{
 width:100%;
 background:transparent;
 color:#aaaabd;
 border:1px solid var(--border);
 border-radius:9px;
 padding:9px;
}

/* MAIN */
.main{
 flex:1;
 min-width:0;
 display:flex;
 flex-direction:column;
}
.topbar{
 height:64px;
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 padding:0 18px;
 gap:10px;
 background:rgba(7,7,17,.72);
 backdrop-filter:blur(15px);
}
.menu-btn{
 display:none;
 border:0;
 background:none;
 color:white;
 font-size:22px;
}
.mode{
 padding:8px 11px;
 background:#11111e;
 border:1px solid var(--border);
 border-radius:10px;
 color:#d6d6e5;
}
.top-spacer{flex:1}
.icon-btn{
 border:1px solid var(--border);
 background:#10101b;
 color:#d5d5e5;
 width:38px;height:38px;
 border-radius:10px;
}
.icon-btn:hover{border-color:#7255d8}

.chat{
 flex:1;
 overflow-y:auto;
 padding:28px max(16px,5vw);
}
.welcome{
 max-width:800px;
 margin:7vh auto 0;
 text-align:center;
}
.welcome h1{
 font-size:clamp(32px,6vw,58px);
 letter-spacing:-3px;
 line-height:1;
 background:linear-gradient(90deg,#fff,#a78bfa,#67e8f9);
 -webkit-background-clip:text;
 color:transparent;
}
.welcome p{
 color:var(--muted);
 margin:15px auto 28px;
 max-width:620px;
}
.quick-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
 max-width:680px;
 margin:auto;
}
.quick{
 text-align:left;
 padding:15px;
 border-radius:15px;
 border:1px solid var(--border);
 background:rgba(255,255,255,.025);
 color:#ddd;
}
.quick:hover{background:rgba(139,92,246,.10)}
.quick b{display:block;margin-bottom:5px}
.quick span{font-size:12px;color:#85859d}

.message{
 max-width:900px;
 margin:0 auto 20px;
 display:flex;
 gap:12px;
}
.message.user{justify-content:flex-end}
.bubble{
 max-width:min(820px,90%);
 padding:13px 16px;
 border-radius:17px;
 line-height:1.6;
 font-size:14px;
 overflow-wrap:anywhere;
}
.user .bubble{
 background:linear-gradient(135deg,#6941d8,#5631b9);
 border-bottom-right-radius:5px;
}
.assistant .bubble{
 background:#11111f;
 border:1px solid var(--border);
 border-bottom-left-radius:5px;
}
.bubble pre{
 overflow:auto;
 background:#080812;
 border:1px solid var(--border);
 padding:13px;
 border-radius:10px;
 margin:10px 0;
}
.bubble code{
 font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
 font-size:12px;
}
.bubble p{margin:5px 0}
.bubble ul,.bubble ol{padding-left:22px}
.msg-actions{
 display:flex;
 gap:5px;
 margin-top:7px;
}
.msg-actions button{
 background:none;
 border:0;
 color:#77778e;
 font-size:11px;
}
.msg-actions button:hover{color:#bbb}

/* INPUT */
.composer-wrap{
 padding:12px max(16px,5vw) 18px;
 background:linear-gradient(transparent,var(--bg) 22%);
}
.composer{
 max-width:900px;
 margin:auto;
 background:#11111e;
 border:1px solid var(--border);
 border-radius:19px;
 padding:9px;
 box-shadow:0 15px 50px rgba(0,0,0,.28);
}
.tools{
 display:flex;
 gap:6px;
 margin-bottom:6px;
}
.tool{
 border:1px solid transparent;
 background:transparent;
 color:#89899e;
 padding:6px 9px;
 border-radius:8px;
 font-size:12px;
}
.tool:hover{background:#1c1c2b;color:#ddd}
.input-row{
 display:flex;
 align-items:flex-end;
 gap:8px;
}
#prompt{
 flex:1;
 resize:none;
 border:0;
 outline:0;
 background:transparent;
 color:white;
 min-height:45px;
 max-height:160px;
 padding:11px 8px;
}
.send{
 width:44px;height:44px;
 border:0;
 border-radius:13px;
 color:white;
 background:linear-gradient(135deg,var(--purple),var(--cyan));
 font-size:18px;
}
.send:disabled{opacity:.45}
.status{
 max-width:900px;
 margin:6px auto 0;
 color:#66667c;
 font-size:10px;
 text-align:center;
}

/* MOBILE */
@media(max-width:750px){
 .sidebar{
  position:fixed;
  z-index:50;
  left:-290px;
  top:0;
  bottom:0;
  transition:.25s;
 }
 .sidebar.open{left:0}
 .menu-btn{display:block}
 .quick-grid{grid-template-columns:1fr}
 .chat{padding:18px 12px}
 .composer-wrap{padding:8px 10px 12px}
 .topbar{padding:0 10px}
 .welcome{margin-top:5vh}
 .welcome h1{letter-spacing:-2px}
}
</style>
</head>

<body>

<!-- AUTH SCREEN -->
<section id="authScreen">
 <div class="auth-card">

  <div class="logo">ZenX</div>
  <div class="tagline">Student AI • Built for the 2027 generation</div>

  <h2 class="auth-title" id="authTitle">Welcome back</h2>

  <form id="authForm">

   <div class="field hidden" id="nameField">
    <label>Name</label>
    <input id="nameInput" type="text" placeholder="Your name">
   </div>

   <div class="field">
    <label>Email</label>
    <input id="emailInput" type="email" autocomplete="email"
           placeholder="you@example.com" required>
   </div>

   <div class="field">
    <label>Password</label>
    <input id="passwordInput" type="password"
           autocomplete="current-password"
           placeholder="Password" required>
   </div>

   <button class="primary" id="authButton" type="submit">
    Sign In
   </button>

  </form>

  <div class="auth-links">
   <button type="button" onclick="toggleAuth()" id="toggleAuthBtn">
    Create account
   </button>
   <button type="button" onclick="showForgotPassword()">
    Forgot password?
   </button>
  </div>

  <button class="secondary hidden" id="backLogin"
          onclick="backToLogin()">
   Back to login
  </button>

  <div id="authMsg"></div>
 </div>
</section>


<!-- APP -->
<section id="app" class="hidden">

 <aside class="sidebar" id="sidebar">

  <div class="brand">
   <div class="brand-icon">Z</div>
   <div class="brand-name">ZenX</div>
   <span class="version">2027</span>
  </div>

  <button class="new-chat" onclick="newChat()">
   ＋ New Chat
  </button>

  <div class="section-title">Recent Chats</div>

  <div class="recents" id="recents"></div>

  <div class="sidebar-bottom">

   <div class="user-box">
    <div class="avatar" id="avatar">Z</div>
    <div class="user-email" id="userEmail">Loading...</div>
   </div>

   <button class="small-btn" onclick="logout()">
    Log out
   </button>

  </div>

 </aside>


 <main class="main">

  <header class="topbar">

   <button class="menu-btn" onclick="toggleSidebar()">☰</button>

   <select class="mode" id="mode">
    <option value="student">🎓 Student</option>
    <option value="jee">⚡ JEE Mode</option>
    <option value="school">📚 School</option>
    <option value="coding">💻 Coding</option>
    <option value="general">🤖 General</option>
   </select>

   <div class="top-spacer"></div>

   <button class="icon-btn" title="New Chat"
           onclick="newChat()">＋</button>

   <button class="icon-btn" title="Refresh"
           onclick="refreshChat()">↻</button>

  </header>


  <div class="chat" id="chat">

   <div class="welcome" id="welcome">

    <h1>What are you learning today?</h1>

    <p>
     ZenX is your AI study companion for concepts,
     questions, coding, revision and exam preparation.
    </p>

    <div class="quick-grid">

     <button class="quick"
       onclick="quickPrompt('Explain this concept to me step by step like a Class 11 student.')">
      <b>🧠 Explain a concept</b>
      <span>Simple → advanced explanation</span>
     </button>

     <button class="quick"
       onclick="quickPrompt('Give me a JEE level practice question and then check my answer.')">
      <b>⚡ Practice JEE</b>
      <span>Build concepts with questions</span>
     </button>

     <button class="quick"
       onclick="quickPrompt('Create a short revision quiz from my current topic.')">
      <b>📝 Make a quiz</b>
      <span>Fast revision</span>
     </button>

     <button class="quick"
       onclick="quickPrompt('Help me understand and debug this code.')">
      <b>💻 Coding help</b>
      <span>Debug and learn</span>
     </button>

    </div>

   </div>

   <div id="messages"></div>

  </div>


  <div class="composer-wrap">

   <div class="composer">

    <div class="tools">

     <button class="tool" onclick="insertTool('Explain: ')">
      🧠 Explain
     </button>

     <button class="tool" onclick="insertTool('Solve: ')">
      🧮 Solve
     </button>

     <button class="tool" onclick="insertTool('Quiz me on: ')">
      📝 Quiz
     </button>

     <button class="tool" onclick="generateImage()">
      🖼️ Image
     </button>

     <button class="tool" onclick="startVoice()">
      🎤 Voice
     </button>

    </div>

    <div class="input-row">

     <textarea id="prompt"
       placeholder="Ask ZenX anything..."
       rows="1"></textarea>

     <button class="send" id="sendBtn"
             onclick="sendMessage()">
      ↑
     </button>

    </div>

   </div>

   <div class="status" id="status">
    ZenX AI • Student-first AI • 2027
   </div>

  </div>

 </main>

</section>


<script>
/* =========================================================
   ZENX CONFIG
   ========================================================= */

const SUPABASE_URL =
"https://srlftvbiqoufejhhfsrh.supabase.co";

/*
 IMPORTANT:
 Put ONLY your Supabase ANON/PUBLIC key here.
 Never put service_role key here.
*/
const SUPABASE_ANON_KEY =
"PASTE_YOUR_SUPABASE_ANON_KEY_HERE";

const API_URL =
"https://zenx-hnkl.onrender.com/api/ask";


/* =========================================================
   SUPABASE
   ========================================================= */

let supabaseClient = null;

if(
 SUPABASE_URL &&
 SUPABASE_ANON_KEY &&
 !SUPABASE_ANON_KEY.includes("PASTE_")
){
 supabaseClient =
  window.supabase.createClient(
   SUPABASE_URL,
   SUPABASE_ANON_KEY
  );
}


/* =========================================================
   STATE
   ========================================================= */

let currentUser = null;
let messages = [];
let chatId = null;
let isSignup = false;
let forgotMode = false;


/* =========================================================
   DOM
   ========================================================= */

const authScreen =
 document.getElementById("authScreen");

const app =
 document.getElementById("app");

const authForm =
 document.getElementById("authForm");

const authTitle =
 document.getElementById("authTitle");

const authButton =
 document.getElementById("authButton");

const toggleAuthBtn =
 document.getElementById("toggleAuthBtn");

const backLogin =
 document.getElementById("backLogin");

const nameField =
 document.getElementById("nameField");

const nameInput =
 document.getElementById("nameInput");

const emailInput =
 document.getElementById("emailInput");

const passwordInput =
 document.getElementById("passwordInput");

const authMsg =
 document.getElementById("authMsg");

const promptInput =
 document.getElementById("prompt");

const messagesBox =
 document.getElementById("messages");

const welcome =
 document.getElementById("welcome");

const sendBtn =
 document.getElementById("sendBtn");

const statusBox =
 document.getElementById("status");

const recents =
 document.getElementById("recents");


/* =========================================================
   INIT
   ========================================================= */

document.addEventListener("DOMContentLoaded", async()=>{
 await checkAuth();

 promptInput.addEventListener("keydown",(e)=>{
  if(e.key==="Enter" && !e.shiftKey){
   e.preventDefault();
   sendMessage();
  }
 });

 promptInput.addEventListener("input",()=>{
  promptInput.style.height="auto";
  promptInput.style.height =
   Math.min(promptInput.scrollHeight,160)+"px";
 });
});


/* =========================================================
   AUTH CHECK
   ========================================================= */

async function checkAuth(){

 if(!supabaseClient){
  showAuthError(
   "Supabase anon key add karo. Phir page refresh karo."
  );
  return;
 }

 try{

  const {data,error} =
   await supabaseClient.auth.getSession();

  if(error) throw error;

  if(data.session){
   currentUser=data.session.user;
   showApp();
  }else{
   showAuth();
  }

  supabaseClient.auth.onAuthStateChange(
   async(event,session)=>{
    if(session){
     currentUser=session.user;
     showApp();
    }else{
     currentUser=null;
     showAuth();
    }
   }
  );

 }catch(error){
  console.error(error);
  showAuthError(error.message);
 }
}


/* =========================================================
   AUTH UI
   ========================================================= */

function showAuth(){
 authScreen.classList.remove("hidden");
 app.classList.add("hidden");
}

function showApp(){

 authScreen.classList.add("hidden");
 app.classList.remove("hidden");

 updateUserUI();
 loadRecents();
 loadCurrentChat();
}

function updateUserUI(){

 if(!currentUser)return;

 const email =
  currentUser.email || "ZenX Student";

 document.getElementById("userEmail")
  .textContent=email;

 document.getElementById("avatar")
  .textContent=
   email.charAt(0).toUpperCase();
}

function toggleAuth(){

 forgotMode=false;
 isSignup=!isSignup;

 authMsg.textContent="";

 if(isSignup){

  authTitle.textContent="Create your ZenX account";
  authButton.textContent="Sign Up";
  toggleAuthBtn.textContent="Already have an account?";
  nameField.classList.remove("hidden");
  passwordInput.required=true;

 }else{

  authTitle.textContent="Welcome back";
  authButton.textContent="Sign In";
  toggleAuthBtn.textContent="Create account";
  nameField.classList.add("hidden");
  passwordInput.required=true;

 }

 backLogin.classList.add("hidden");
}

function backToLogin(){

 forgotMode=false;
 isSignup=false;

 authTitle.textContent="Welcome back";
 authButton.textContent="Sign In";
 toggleAuthBtn.textContent="Create account";

 nameField.classList.add("hidden");
 backLogin.classList.add("hidden");

 passwordInput.classList.remove("hidden");
 passwordInput.required=true;
}

async function showForgotPassword(){

 if(!supabaseClient){
  showAuthError("Supabase configuration missing.");
  return;
 }

 forgotMode=true;
 isSignup=false;

 authTitle.textContent="Reset password";
 authButton.textContent="Send reset email";

 nameField.classList.add("hidden");
 passwordInput.required=false;
 passwordInput.value="";
 passwordInput.classList.add("hidden");

 toggleAuthBtn.textContent="Back to login";
 backLogin.classList.remove("hidden");

 authMsg.textContent="";
}

authForm.addEventListener("submit",async(e)=>{

 e.preventDefault();

 if(!supabaseClient){
  showAuthError("Supabase anon key add karo.");
  return;
 }

 const email=emailInput.value.trim();
 const password=passwordInput.value;

 if(!email){
  showAuthError("Email enter karo.");
  return;
 }

 authButton.disabled=true;

 try{

  if(forgotMode){

   const redirect =
    window.location.origin +
    window.location.pathname;

   const {error} =
    await supabaseClient.auth.resetPasswordForEmail(
     email,
     {redirectTo:redirect}
    );

   if(error)throw error;

   showAuthSuccess(
    "Password reset email sent. Inbox/spam check karo."
   );

   return;
  }

  if(isSignup){

   if(password.length<6){
    showAuthError(
     "Password minimum 6 characters ka hona chahiye."
    );
    return;
   }

   const {data,error} =
    await supabaseClient.auth.signUp({
     email,
     password,
     options:{
      data:{
       full_name:nameInput.value.trim()
      }
     }
    });

   if(error)throw error;

   if(data.session){
    currentUser=data.user;
    showApp();
   }else{
    showAuthSuccess(
     "Account created. Agar email verification enabled hai to inbox check karo."
    );
   }

  }else{

   const {data,error} =
    await supabaseClient.auth.signInWithPassword({
     email,
     password
    });

   if(error)throw error;

   currentUser=data.user;
   showApp();
  }

 }catch(error){

  console.error(error);

  showAuthError(
   error.message || "Authentication failed."
  );

 }finally{
  authButton.disabled=false;
 }
});


function showAuthError(text){
 authMsg.style.color="#fca5a5";
 authMsg.textContent=text;
}

function showAuthSuccess(text){
 authMsg.style.color="#86efac";
 authMsg.textContent=text;
}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout(){

 if(!supabaseClient)return;

 await supabaseClient.auth.signOut();

 currentUser=null;
 messages=[];
 chatId=null;

 showAuth();
}


/* =========================================================
   STORAGE
   ========================================================= */

function getStorageKey(){

 if(!currentUser)return "zenx_guest";

 return "zenx_chats_"+currentUser.id;
}

function saveMessages(){

 try{

  localStorage.setItem(
   getStorageKey(),
   JSON.stringify(messages)
  );

 }catch(error){
  console.error(error);
 }
}

function loadCurrentChat(){

 try{

  const saved =
   localStorage.getItem(getStorageKey());

  messages =
   saved
   ? JSON.parse(saved)
   : [];

 }catch(error){
  messages=[];
 }

 renderMessages();
 updateHistory();
}

function saveRecents(){

 try{

  localStorage.setItem(
   getStorageKey()+"_recents",
   JSON.stringify(
    getRecentData()
   )
  );

 }catch(error){
  console.error(error);
 }
}

function getRecentData(){

 return messages
  .filter(m=>m.role==="user")
  .slice(0,30)
  .map((m,i)=>({
   id:i,
   title:m.content.slice(0,60)
  }));
}

function loadRecents(){

 if(!currentUser){
  recents.innerHTML="";
  return;
 }

 let data=[];

 try{

  data=JSON.parse(
   localStorage.getItem(
    getStorageKey()+"_recents"
   )
  ) || [];

 }catch(e){
  data=[];
 }

 if(!data.length){
  recents.innerHTML=
   `<div style="color:#66667c;font-size:12px;padding:10px">
    No recent chats
   </div>`;
  return;
 }

 recents.innerHTML="";

 data.forEach((item,index)=>{

  const row=document.createElement("div");
  row.className="recent";

  row.innerHTML=`
   <span>💬</span>
   <span class="recent-text"></span>
   <button class="delete-recent"
           title="Delete"
           onclick="event.stopPropagation();deleteRecent(${index})">
    ×
   </button>
  `;

  row.querySelector(".recent-text")
   .textContent=item.title;

  row.onclick=()=>{
   scrollToMessage(index);
  };

  recents.appendChild(row);
 });
}

 }

/* =========================================================
   RENDER
   ========================================================= */

function renderMessages(){

 messagesBox.innerHTML="";

 if(messages.length){
  welcome.classList.add("hidden");
 }else{
  welcome.classList.remove("hidden");
 }

 messages.forEach((m,index)=>{
  addMessageToDOM(
   m.role,
   m.content,
   index
  );
 });
}

function addMessageToDOM(
 role,
 content,
 index
){

 const wrapper=
  document.createElement("div");

 wrapper.className=
  "message "+role;

 const bubble=
  document.createElement("div");

 bubble.className="bubble";

 if(role==="assistant"){

  try{
   bubble.innerHTML=
    marked.parse(content || "");
  }catch(e){
   bubble.textContent=content;
  }

 }else{

  bubble.textContent=content;
 }

 wrapper.appendChild(bubble);

 if(role==="assistant"){

  const actions=
   document.createElement("div");

  actions.className="msg-actions";

  actions.innerHTML=`
   <button onclick="speakText(${index})">🔊 Read</button>
   <button onclick="copyMessage(${index})">📋 Copy</button>
  `;

  bubble.appendChild(actions);
 }

 messagesBox.appendChild(wrapper);

 return wrapper;
}


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage(){

 const text=
  promptInput.value.trim();

 if(!text || sendBtn.disabled)return;

 if(!currentUser){
  statusBox.textContent=
   "Please sign in first.";
  return;
 }

 messages.push({
  role:"user",
  content:text
 });

 welcome.classList.add("hidden");

 addMessageToDOM(
  "user",
  text,
  messages.length-1
 );

 promptInput.value="";
 promptInput.style.height="auto";

 saveMessages();
 updateHistory();

 sendBtn.disabled=true;

 const loading=
  addMessageToDOM(
   "assistant",
   "Thinking…",
   -1
  );

 statusBox.textContent=
  "ZenX is thinking...";

 try{

  const mode=
   document.getElementById("mode").value;

  const response=
   await fetch(API_URL,{
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "Accept":"application/json"
    },
    body:JSON.stringify({
     question:text,
     mode:mode,
     history:messages.slice(-12),
     user_id:currentUser.id
    })
  });

  if(!response.ok){

   let errText=
    "API error "+response.status;

   try{
    const err=await response.json();
    errText=
     err.detail ||
     err.message ||
     errText;
   }catch(e){}

   throw new Error(errText);
  }

  const data=
   await response.json();

  const answer=
   data.answer ||
   data.response ||
   data.message ||
   data.result;

  if(!answer){
   throw new Error(
    "Backend ne AI response nahi diya."
   );
  }

  loading.remove();

  messages.push({
   role:"assistant",
   content:String(answer)
  });

  addMessageToDOM(
   "assistant",
   String(answer),
   messages.length-1
  );

  saveMessages();
  updateHistory();

  statusBox.textContent=
   "ZenX AI • Ready";

 }catch(error){

  console.error(error);

  loading.remove();

  const errorMessage=
   "⚠️ AI connection problem.\n\n"+
   error.message+
   "\n\nBackend/Render API check karo.";

  messages.push({
   role:"assistant",
   content:errorMessage
  });

  addMessageToDOM(
   "assistant",
   errorMessage,
   messages.length-1
  );

  saveMessages();

  statusBox.textContent=
   "Connection error";

 }finally{

  sendBtn.disabled=false;
  promptInput.focus();
 }
}

/* =========================================================
   COPY
   ========================================================= */

async function copyMessage(index){

 if(!messages[index])return;

 try{

  await navigator.clipboard.writeText(
   messages[index].content
  );

  statusBox.textContent=
   "Copied";

  setTimeout(()=>{
   statusBox.textContent=
    "ZenX AI • Student-first AI • 2027";
  },1200);

 }catch(e){
  console.error(e);
 }
}


/* =========================================================
   TEXT TO SPEECH
   ========================================================= */

function speakText(index){

 if(!messages[index])return;

 if(!("speechSynthesis" in window)){
  statusBox.textContent=
   "Voice playback browser mein available nahi hai.";
  return;
 }

 window.speechSynthesis.cancel();

 const text=
  messages[index].content
   .replace(/[#*_`]/g," ");

 const utterance=
  new SpeechSynthesisUtterance(text);

 utterance.rate=.95;
 utterance.pitch=1;

 window.speechSynthesis.speak(
  utterance
 );
}


/* =========================================================
   VOICE INPUT
   ========================================================= */

function startVoice(){

 const SpeechRecognition=
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

 if(!SpeechRecognition){

  statusBox.textContent=
   "Voice input is not supported in this browser.";

  return;
 }

 const recognition=
  new SpeechRecognition();

 recognition.lang="en-IN";
 recognition.interimResults=false;
 recognition.continuous=false;

 statusBox.textContent=
  "🎤 Listening...";

 recognition.onresult=(event)=>{

  const text=
   event.results[0][0].transcript;

  promptInput.value +=
   (promptInput.value ? " " : "")+
   text;

  promptInput.dispatchEvent(
   new Event("input")
  );

  statusBox.textContent=
   "Voice captured";
 };

 recognition.onerror=(event)=>{

  console.error(event);

  statusBox.textContent=
   "Voice input error";
 };

 recognition.onend=()=>{

  setTimeout(()=>{
   statusBox.textContent=
    "ZenX AI • Ready";
  },1000);
 };

 recognition.start();
}


/* =========================================================
   IMAGE GENERATION
   ========================================================= */

async function generateImage(){

 const prompt=
  window.prompt(
   "What image should ZenX generate?"
  );

 if(!prompt || !prompt.trim())return;

 if(!currentUser){
  alert("Please sign in first.");
  return;
 }

 sendBtn.disabled=true;

 statusBox.textContent=
  "🖼️ Generating image...";

 const loading=
  addMessageToDOM(
   "assistant",
   "🖼️ Creating your image…",
   -1
  );

 try{

  /*
   This endpoint will be implemented
   in main.py next.
  */

  const response=
   await fetch(
    API_URL.replace(
     "/api/ask",
     "/api/image"
    ),
    {
     method:"POST",
     headers:{
      "Content-Type":"application/json",
      "Accept":"application/json"
     },
     body:JSON.stringify({
      prompt:prompt.trim(),
      user_id:currentUser.id
     })
    }
   );

  if(!response.ok){
   throw new Error(
    "Image API error "+response.status
   );
  }

  const data=
   await response.json();

  loading.remove();

  if(data.image_url){

   const imageHTML=
    `<p>🖼️ Generated image:</p>
     <img src="${escapeHTML(data.image_url)}"
          alt="Generated image"
          style="max-width:100%;border-radius:14px;margin-top:8px">`;

   const wrapper=
    document.createElement("div");

   wrapper.className=
    "message assistant";

   const bubble=
    document.createElement("div");

   bubble.className="bubble";
   bubble.innerHTML=imageHTML;

   wrapper.appendChild(bubble);
   messagesBox.appendChild(wrapper);

   messages.push({
    role:"assistant",
    content:
     "Generated image for: "+prompt
   });

   saveMessages();

  }else{

   throw new Error(
    "Image URL missing from backend."
   );
  }

  statusBox.textContent=
   "Image generated";

 }catch(error){

  loading.remove();

  const errorText=
   "⚠️ Image generation unavailable.\n\n"+
   error.message;

  messages.push({
   role:"assistant",
   content:errorText
  });

  addMessageToDOM(
   "assistant",
   errorText,
   messages.length-1
  );

  saveMessages();

  statusBox.textContent=
   "Image generation error";

 }finally{
  sendBtn.disabled=false;
 }
}


/* =========================================================
   DELETE RECENT
   ========================================================= */

function deleteRecent(index){

 let data=[];

 try{
  data=JSON.parse(
   localStorage.getItem(
    getStorageKey()+"_recents"
   )
  ) || [];
 }catch(e){}

 data.splice(index,1);

 localStorage.setItem(
  getStorageKey()+"_recents",
  JSON.stringify(data)
 );

 loadRecents();
}

/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHTML(text){

 return String(text)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}
