<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070711">
<meta name="description" content="ZenX.AI - AI for a better tomorrow">
<title>ZenX.AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#070711;
  --panel:#0d0d19;
  --panel2:#11111f;
  --border:#25253a;
  --text:#f7f7ff;
  --muted:#9698ad;
  --purple:#7c5cff;
  --blue:#3f8cff;
}

body{
  width:100%;
  height:100vh;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,Helvetica,sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  background:
    radial-gradient(circle at 75% 0%,#17143b 0%,#070711 38%);
}

/* SIDEBAR */

.sidebar{
  width:290px;
  height:100%;
  background:rgba(10,10,20,.97);
  border-right:1px solid var(--border);
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.brand img{
  width:45px;
  height:45px;
  object-fit:cover;
  border-radius:13px;
  background:#000;
}

.brand-title{
  font-size:19px;
  font-weight:800;
}

.brand-sub{
  color:var(--muted);
  font-size:9px;
  margin-top:3px;
  letter-spacing:.5px;
}

.new-chat{
  width:100%;
  padding:13px;
  border:none;
  border-radius:13px;
  color:white;
  font-weight:800;
  background:linear-gradient(135deg,#7c5cff,#427fff);
  box-shadow:0 12px 35px rgba(100,80,255,.18);
}

.menu{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.menu-btn,
.mode-btn{
  width:100%;
  border:none;
  background:transparent;
  color:#cfd0df;
  text-align:left;
  padding:11px 12px;
  border-radius:11px;
}

.menu-btn:hover,
.mode-btn:hover,
.mode-btn.active{
  background:#17172a;
  color:white;
}

.section-title{
  color:#71738a;
  font-size:10px;
  letter-spacing:1px;
  text-transform:uppercase;
  margin-top:3px;
}

.search-box{
  display:flex;
  align-items:center;
  gap:7px;
  background:#121222;
  border:1px solid var(--border);
  border-radius:12px;
  padding:9px 10px;
}

.search-box input{
  width:100%;
  background:transparent;
  border:none;
  outline:none;
  color:white;
}

.recents{
  flex:1;
  min-height:60px;
  overflow-y:auto;
}

.chat-item{
  width:100%;
  border:none;
  background:transparent;
  color:#bfc0d0;
  text-align:left;
  padding:10px;
  border-radius:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-item:hover{
  background:#151527;
  color:white;
}

.empty{
  color:#66687d;
  font-size:12px;
  text-align:center;
  padding:20px 5px;
}

.student-modes{
  max-height:170px;
  overflow-y:auto;
}

.founder{
  border-top:1px solid var(--border);
  padding-top:12px;
  color:#77798e;
  font-size:11px;
  line-height:1.6;
}

.founder b{
  color:#ddd;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:70px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  border-bottom:1px solid var(--border);
  background:rgba(8,8,18,.88);
  backdrop-filter:blur(15px);
}

.top-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.mobile-menu{
  display:none;
  border:1px solid var(--border);
  background:#141424;
  color:white;
  padding:9px 11px;
  border-radius:10px;
}

.student-badge{
  border:1px solid #725cff55;
  background:#725cff18;
  color:#d0c9ff;
  border-radius:999px;
  padding:8px 13px;
  font-size:12px;
  font-weight:800;
}

.mode-select{
  background:#121222;
  border:1px solid var(--border);
  color:white;
  border-radius:10px;
  padding:8px 11px;
  outline:none;
}

/* CHAT */

.chat-area{
  flex:1;
  overflow-y:auto;
  padding:30px max(18px,calc((100% - 900px)/2));
  scroll-behavior:smooth;
}

.welcome{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding-bottom:70px;
}

.big-logo{
  width:90px;
  height:90px;
  border-radius:24px;
  object-fit:cover;
  margin-bottom:18px;
  box-shadow:0 20px 70px rgba(100,80,255,.2);
}

.welcome h1{
  font-size:clamp(32px,6vw,52px);
  margin-bottom:9px;
}

.gradient{
  background:linear-gradient(90deg,#fff,#a78cff,#55cfff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.welcome p{
  max-width:650px;
  color:var(--muted);
  line-height:1.65;
}

.quick-actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:9px;
  margin-top:22px;
}

.quick-actions button{
  border:1px solid var(--border);
  background:#121222;
  color:#c8c9d8;
  padding:10px 14px;
  border-radius:999px;
}

.quick-actions button:hover{
  background:#19192b;
  color:white;
}

/* MESSAGES */

.message{
  display:flex;
  gap:12px;
  margin:19px 0;
  align-items:flex-start;
}

.avatar{
  width:35px;
  height:35px;
  flex-shrink:0;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:#17172b;
  border:1px solid var(--border);
  font-size:14px;
  font-weight:800;
}

.bubble{
  max-width:min(780px,100%);
  line-height:1.65;
  overflow-wrap:anywhere;
}

.user .bubble{
  background:#15152a;
  border:1px solid var(--border);
  padding:12px 15px;
  border-radius:16px;
  white-space:pre-wrap;
}

.ai .bubble{
  padding-top:5px;
  white-space:pre-wrap;
}

.code{
  display:block;
  overflow:auto;
  background:#090914;
  border:1px solid var(--border);
  padding:13px;
  border-radius:12px;
  margin:8px 0;
  font-family:monospace;
  white-space:pre;
}

.message-actions{
  display:flex;
  gap:5px;
  margin-top:7px;
}

.message-actions button{
  border:none;
  background:transparent;
  color:#77798f;
  padding:5px 7px;
  border-radius:7px;
  font-size:11px;
}

.message-actions button:hover{
  background:#151527;
  color:white;
}

.generated-image{
  width:min(700px,100%);
  display:block;
  margin-top:10px;
  border-radius:16px;
  border:1px solid var(--border);
}

/* COMPOSER */

.composer-area{
  flex-shrink:0;
  padding:12px max(16px,calc((100% - 900px)/2)) 18px;
  background:linear-gradient(transparent,#070711 25%);
}

.composer{
  display:flex;
  align-items:flex-end;
  gap:8px;
  background:#10101e;
  border:1px solid #2b2b45;
  border-radius:18px;
  padding:9px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.composer textarea{
  flex:1;
  min-height:44px;
  max-height:150px;
  resize:none;
  outline:none;
  border:none;
  background:transparent;
  color:white;
  padding:11px 9px;
  line-height:1.45;
}

.icon-btn{
  width:42px;
  height:42px;
  flex-shrink:0;
  border:none;
  border-radius:12px;
  background:#17172a;
  color:#c7c8d8;
}

.image-btn.active{
  background:#261c50;
  color:#d7d0ff;
  border:1px solid #735aff66;
}

.send-btn{
  background:linear-gradient(135deg,#7c5cff,#427fff);
  color:white;
  font-weight:900;
}

.send-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.status{
  text-align:center;
  color:#66687e;
  font-size:10px;
  margin-top:7px;
}

/* MOBILE */

.overlay{
  display:none;
}

@media(max-width:800px){

  .sidebar{
    position:fixed;
    top:0;
    bottom:0;
    left:-310px;
    transition:.22s;
    box-shadow:30px 0 80px rgba(0,0,0,.7);
  }

  .sidebar.open{
    left:0;
  }

  .overlay.show{
    display:block;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:90;
  }

  .mobile-menu{
    display:block;
  }

  .topbar{
    padding:0 12px;
  }

  .chat-area{
    padding:20px 13px;
  }

  .composer-area{
    padding:9px 9px 14px;
  }

  .mode-select{
    max-width:125px;
  }

  .welcome{
    padding-bottom:40px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <img src="/zenx-logo.png" alt="ZenX.AI">
      <div>
        <div class="brand-title">ZenX.AI</div>
        <div class="brand-sub">AI FOR A BETTER TOMORROW</div>
      </div>
    </div>

    <button class="new-chat" id="newChat">
      ＋ New Chat
    </button>

    <div class="menu">

      <button class="menu-btn" id="recentBtn">
        🕘 Recent Search
      </button>

      <button class="menu-btn" id="folderBtn">
        📁 Folders
      </button>

      <button class="menu-btn" id="clearBtn">
        🧹 Clear Recents
      </button>

    </div>

    <div class="section-title">
      Search Recents
    </div>

    <div class="search-box">
      🔎
      <input
        id="searchInput"
        type="text"
        placeholder="Search chats..."
      >
    </div>

    <div class="recents" id="recents"></div>

    <div class="section-title">
      Student Modes
    </div>

    <div class="student-modes">

      <button class="mode-btn active" data-mode="Student">
        🎓 Student
      </button>

      <button class="mode-btn" data-mode="JEE">
        ⚡ JEE
      </button>

      <button class="mode-btn" data-mode="NEET">
        🧬 NEET
      </button>

      <button class="mode-btn" data-mode="Coding">
        💻 Coding
      </button>

      <button class="mode-btn" data-mode="Study Planner">
        📚 Study Planner
      </button>

    </div>

    <div class="founder">
      Founder:
      <b>Abhay Srivastava</b>
      <br>
      ZenX.AI © 2026
    </div>

  </aside>


  <!-- MAIN -->
  <main class="main">

    <header class="topbar">

      <div class="top-left">

        <button class="mobile-menu" id="mobileMenu">
          ☰
        </button>

        <span class="student-badge">
          🎓 Student Mode
        </span>

      </div>

      <select class="mode-select" id="topMode">
        <option>Student</option>
        <option>JEE</option>
        <option>NEET</option>
        <option>Coding</option>
        <option>Study Planner</option>
      </select>

    </header>


    <!-- CHAT -->
    <section class="chat-area" id="chatArea"></section>


    <!-- COMPOSER -->
    <div class="composer-area">

      <div class="composer">

        <button
          class="icon-btn image-btn"
          id="imageToggle"
          title="AI Image Generation"
        >
          🖼️
        </button>

        <textarea
          id="input"
          rows="1"
          placeholder="Message ZenX.AI..."
          autocomplete="off"
        ></textarea>

        <button
          class="icon-btn send-btn"
          id="send"
          title="Send"
        >
          ➤
        </button>

      </div>

      <div class="status" id="status">
        ZenX.AI • Student Mode • Founder: Abhay Srivastava
      </div>

    </div>

  </main>

</div>


<div class="overlay" id="overlay"></div>


<script>

/* =========================================
   ZENX.AI CORE
========================================= */

const $ = selector => document.querySelector(selector);

const chatArea = $("#chatArea");
const input = $("#input");
const sendButton = $("#send");
const status = $("#status");

const sidebar = $("#sidebar");
const overlay = $("#overlay");

let messages = [];
let currentMode = "Student";
let imageMode = false;
let currentTitle = "New Chat";

const STORAGE_KEY = "zenx_recent_chats_v1";


/* =========================================
   LOCAL STORAGE
========================================= */

function getRecents(){

  try{

    return JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "[]"
    );

  }catch(error){

    return [];

  }

}


function saveRecents(list){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(list.slice(0,50))
    );

  }catch(error){

    console.error(error);

  }

}


/* =========================================
   SAFE TEXT
========================================= */

function escapeHTML(text){

  return String(text).replace(
    /[&<>"']/g,
    character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[character])
  );

}


/* =========================================
   SIMPLE MARKDOWN
========================================= */

function formatAIText(text){

  let safe = escapeHTML(text);

  safe = safe.replace(
    /```([\s\S]*?)```/g,
    '<pre class="code">$1</pre>'
  );

  safe = safe.replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  );

  safe = safe.replace(
    /`([^`]+)`/g,
    "<code>$1</code>"
  );

  return safe;

}


/* =========================================
   WELCOME SCREEN
========================================= */

function showWelcome(){

  chatArea.innerHTML = `

    <div class="welcome">

      <img
        class="big-logo"
        src="/zenx-logo.png"
        alt="ZenX.AI"
      >

      <h1>
        Meet
        <span class="gradient">
          ZenX.AI
        </span>
      </h1>

      <p>
        Your fast AI assistant for learning, coding,
        ideas and creative work.
        Student Mode is ready for JEE, NEET,
        school and study planning.
      </p>

      <div class="quick-actions">

        <button data-query="Explain this topic in simple language">
          📖 Explain a Topic
        </button>

        <button data-query="Make me a focused study plan for today">
          📚 Study Plan
        </button>

        <button data-query="Help me debug my code">
          💻 Debug Code
        </button>

        <button data-query="Create an image of a futuristic study room">
          🖼️ Generate Image
        </button>

      </div>

    </div>

  `;


  document
    .querySelectorAll("[data-query]")
    .forEach(button => {

      button.onclick = () => {

        const query = button.dataset.query;

        input.value = query;

        if(
          query.toLowerCase().includes("image")
        ){

          imageMode = true;
          updateImageButton();

        }

        sendMessage();

      };

    });

}


/* =========================================
   RENDER MESSAGE
========================================= */

function renderMessage(message,index){

  const row = document.createElement("div");

  row.className =
    "message " +
    (message.role === "user" ? "user" : "ai");


  const avatar = document.createElement("div");

  avatar.className = "avatar";

  avatar.textContent =
    message.role === "user"
      ? "U"
      : "Z";


  const bubble = document.createElement("div");

  bubble.className = "bubble";


  if(message.image){

    bubble.innerHTML = `

      ${
        message.text
          ? `<div>${formatAIText(message.text)}</div>`
          : ""
      }

      <img
        class="generated-image"
        src="${message.image}"
        alt="Generated by ZenX.AI"
      >

      <div class="message-actions">

        <button data-copy="${index}">
          Copy
        </button>

        <button data-download="${index}">
          Download
        </button>

      </div>

    `;

  }else{

    bubble.innerHTML =
      formatAIText(
        message.content || ""
      );


    if(message.role === "model"){

      bubble.innerHTML += `

        <div class="message-actions">

          <button data-copy="${index}">
            Copy
          </button>

        </div>

      `;

    }

  }


  row.appendChild(avatar);
  row.appendChild(bubble);

  chatArea.appendChild(row);

}


/* =========================================
   RENDER ALL MESSAGES
========================================= */

function renderMessages(){

  chatArea.innerHTML = "";

  if(!messages.length){

    showWelcome();
    return;

  }

  messages.forEach(
    renderMessage
  );

  requestAnimationFrame(() => {

    chatArea.scrollTop =
      chatArea.scrollHeight;

  });

}


/* =========================================
   ADD MESSAGE
========================================= */

function addMessage(message){

  messages.push(message);

  renderMessages();

}


/* =========================================
   IMAGE BUTTON
========================================= */

function updateImageButton(){

  const button = $("#imageToggle");

  if(imageMode){

    button.textContent = "✨";

    button.classList.add("active");

    input.placeholder =
      "Describe the image you want...";

  }else{

    button.textContent = "🖼️";

    button.classList.remove("active");

    input.placeholder =
      "Message ZenX.AI...";

  }

}


/* =========================================
   MODE
========================================= */

function setMode(mode){

  currentMode = mode;

  $("#topMode").value = mode;

  document
    .querySelectorAll(".mode-btn")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.mode === mode
      );

    });


  status.textContent =
    `ZenX.AI • ${mode} Mode • Founder: Abhay Srivastava`;

}


/* =========================================
   NEW CHAT
========================================= */

function newChat(){

  messages = [];

  currentTitle = "New Chat";

  imageMode = false;

  input.value = "";

  updateImageButton();

  showWelcome();

  closeSidebar();

  input.focus();

}


/* =========================================
   SAVE CURRENT CHAT
========================================= */

function saveCurrentChat(){

  if(!messages.length) return;


  const firstUserMessage =
    messages.find(
      message =>
        message.role === "user"
    );


  if(!firstUserMessage) return;


  const title =
    currentTitle === "New Chat"
      ? String(
          firstUserMessage.content || ""
        ).slice(0,70)
      : currentTitle;


  const recents = getRecents();


  recents.unshift({

    id:Date.now(),

    title,

    mode:currentMode,

    messages,

    date:new Date().toISOString()

  });


  saveRecents(recents);

  renderRecents();

}


/* =========================================
   RECENTS
========================================= */

function renderRecents(filter=""){

  const container = $("#recents");

  container.innerHTML = "";

  const list =
    getRecents().filter(item =>
      String(item.title || "")
        .toLowerCase()
        .includes(
          filter.toLowerCase()
        )
    );


  if(!list.length){

    container.innerHTML =
      `<div class="empty">
        No recent chats
      </div>`;

    return;

  }


  list.forEach(item => {

    const button =
      document.createElement("button");

    button.className =
      "chat-item";

    button.textContent =
      item.title;

    button.title =
      item.title;


    button.onclick = () => {

      messages =
        item.messages || [];

      currentTitle =
        item.title || "New Chat";

      setMode(
        item.mode || "Student"
      );

      renderMessages();

      closeSidebar();

    };


    container.appendChild(button);

  });

}


/* =========================================
   SIDEBAR
========================================= */

function closeSidebar(){

  sidebar.classList.remove("open");

  overlay.classList.remove("show");

}


/* =========================================
   AUTO TEXTAREA
========================================= */

function autoResize(){

  input.style.height = "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      150
    ) + "px";

}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage(){

  const text =
    input.value.trim();


  if(!text || sendButton.disabled){

    return;

  }


  if(currentTitle === "New Chat"){

    currentTitle =
      text.slice(0,70);

  }


  input.value = "";

  autoResize();


  addMessage({

    role:"user",

    content:text

  });


  sendButton.disabled = true;


  status.textContent =
    imageMode
      ? "ZenX.AI is generating your image..."
      : "ZenX.AI is thinking...";


  try{

    /* IMAGE GENERATION */

    if(imageMode){

      const response =
        await fetch(
          "/api/image",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
              prompt:text
            })

          }
        );


      const data =
        await response.json();


      if(!response.ok){

        throw new Error(
          data.error ||
          "Image generation failed."
        );

      }


      addMessage({

        role:"model",

        text:
          data.text ||
          "Image generated by ZenX.AI.",

        image:data.image

      });


    }

    /* TEXT AI */

    else{

      const history =
        messages
          .filter(
            message =>
              message.role === "user" ||
              message.role === "model"
          )
          .slice(-20);


      const response =
        await fetch(
          "/api/chat",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

              messages:history,

              prompt:text,

              mode:currentMode

            })

          }
        );


      const data =
        await response.json();


      if(!response.ok){

        throw new Error(
          data.error ||
          "AI request failed."
        );

      }


      addMessage({

        role:"model",

        content:
          data.text ||
          "I couldn't generate a response."

      });

    }


    saveCurrentChat();

  }catch(error){

    console.error(
      "ZenX error:",
      error
    );


    addMessage({

      role:"model",

      content:
        "Sorry, I couldn't complete your request.\n\n" +
        error.message

    });

  }


  sendButton.disabled = false;

  imageMode = false;

  updateImageButton();

  status.textContent =
    `ZenX.AI • ${currentMode} Mode • Founder: Abhay Srivastava`;

}


/* =========================================
   BUTTON EVENTS
========================================= */

sendButton.onclick =
  sendMessage;


input.addEventListener(
  "input",
  autoResize
);


input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


$("#newChat").onclick =
  newChat;


$("#mobileMenu").onclick =
  () => {

    sidebar.classList.add("open");

    overlay.classList.add("show");

  };


overlay.onclick =
  closeSidebar;


$("#imageToggle").onclick =
  () => {

    imageMode =
      !imageMode;

    updateImageButton();

    input.focus();

  };


$("#topMode").onchange =
  event => {

    setMode(
      event.target.value
    );

  };


document
  .querySelectorAll(".mode-btn")
  .forEach(button => {

    button.onclick = () => {

      setMode(
        button.dataset.mode
      );

    };

  });


$("#searchInput").oninput =
  event => {

    renderRecents(
      event.target.value
    );

  };


$("#recentBtn").onclick =
  () => {

    renderRecents();

    closeSidebar();

  };


$("#folderBtn").onclick =
  () => {

    alert(
      "Folders are ready in the ZenX.AI menu. Cloud folders can be connected when a database is enabled."
    );

  };


$("#clearBtn").onclick =
  () => {

    const confirmClear =
      confirm(
        "Clear all recent chats from this browser?"
      );


    if(confirmClear){

      localStorage.removeItem(
        STORAGE_KEY
      );

      renderRecents();

    }

  };


/* =========================================
   MESSAGE ACTIONS
========================================= */

chatArea.addEventListener(
  "click",
  async event => {

    const copyIndex =
      event.target.dataset.copy;


    if(copyIndex !== undefined){

      const message =
        messages[
          Number(copyIndex)
        ];


      const text =
        message.content ||
        message.text ||
        "";


      try{

        await navigator.clipboard.writeText(
          text
        );

        event.target.textContent =
          "Copied";

        setTimeout(
          () => {
            event.target.textContent =
              "Copy";
          },
          1000
        );

      }catch(error){

        console.error(error);

      }

    }


    const downloadIndex =
      event.target.dataset.download;


    if(downloadIndex !== undefined){

      const message =
        messages[
          Number(downloadIndex)
        ];


      if(message.image){

        const link =
          document.createElement("a");

        link.href =
          message.image;

        link.download =
          "zenx-ai-image.png";

        document.body.appendChild(link);

        link.click();

        link.remove();

      }

    }

  }
);


/* =========================================
   START APP
========================================= */

showWelcome();

renderRecents();

updateImageButton();

</script>

</body>
</html>
