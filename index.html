<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080812">
<title>ZenX AI — Student AI 2027</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#080812;
  color:#fff;
  min-height:100vh;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

#authScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 20% 20%,#642cff33,transparent 35%),
    radial-gradient(circle at 80% 80%,#00e5ff22,transparent 35%),
    #080812;
}

.authBox{
  width:100%;
  max-width:430px;
  padding:32px;
  border:1px solid #ffffff18;
  border-radius:25px;
  background:#11111dcc;
  backdrop-filter:blur(20px);
  box-shadow:0 25px 80px #0008;
}

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  background:linear-gradient(90deg,#8b5cff,#00e5ff,#ff4fd8);
  -webkit-background-clip:text;
  color:transparent;
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin:8px 0 25px;
}

.authBox h2{
  margin-bottom:18px;
}

.authBox input{
  width:100%;
  padding:14px 15px;
  margin:7px 0;
  border:1px solid #ffffff18;
  border-radius:13px;
  background:#080812;
  color:white;
  outline:none;
}

.authBox input:focus{
  border-color:#8b5cff;
}

.primary{
  width:100%;
  padding:14px;
  border:0;
  border-radius:13px;
  margin-top:12px;
  color:white;
  font-weight:800;
  background:linear-gradient(90deg,#7546ff,#00bde8);
}

.secondary{
  width:100%;
  padding:13px;
  border:1px solid #ffffff18;
  border-radius:13px;
  margin-top:10px;
  color:#ddd;
  background:#ffffff08;
}

.linkBtn{
  background:none;
  border:0;
  color:#64dfff;
  margin-top:14px;
}

.authMessage{
  min-height:22px;
  margin-top:12px;
  text-align:center;
  color:#ffcf70;
  font-size:14px;
}

/* APP */

#appScreen{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:270px;
  min-height:100vh;
  background:#0d0d18;
  border-right:1px solid #ffffff10;
  padding:18px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  overflow-y:auto;
}

.sideLogo{
  font-size:27px;
  font-weight:900;
  margin-bottom:25px;
  background:linear-gradient(90deg,#8b5cff,#00e5ff);
  -webkit-background-clip:text;
  color:transparent;
}

.sideButton{
  width:100%;
  border:1px solid #ffffff12;
  background:#ffffff06;
  color:#ddd;
  padding:12px;
  border-radius:12px;
  margin-bottom:9px;
  text-align:left;
}

.sideButton:hover{
  background:#ffffff10;
}

.sectionTitle{
  color:#777;
  font-size:12px;
  text-transform:uppercase;
  margin:22px 5px 10px;
}

.recent{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:7px;
}

.recent button:first-child{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  border:0;
  background:#ffffff06;
  color:#bbb;
  padding:10px;
  border-radius:10px;
  text-align:left;
}

.deleteRecent{
  width:34px;
  height:34px;
  border:0;
  border-radius:9px;
  background:#ff335511;
  color:#ff6680;
}

.main{
  width:100%;
  margin-left:270px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:65px;
  border-bottom:1px solid #ffffff10;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  background:#080812dd;
  backdrop-filter:blur(15px);
  position:sticky;
  top:0;
  z-index:10;
}

.topTitle{
  font-weight:800;
}

.userEmail{
  color:#888;
  font-size:12px;
}

.chat{
  flex:1;
  width:100%;
  max-width:950px;
  margin:auto;
  padding:30px 20px 160px;
}

.welcome{
  text-align:center;
  padding:70px 10px 35px;
}

.welcome h1{
  font-size:48px;
  margin-bottom:12px;
  background:linear-gradient(90deg,#fff,#9e7cff,#51e7ff);
  -webkit-background-clip:text;
  color:transparent;
}

.welcome p{
  color:#999;
}

.message{
  display:flex;
  gap:12px;
  margin:18px 0;
}

.avatar{
  min-width:38px;
  height:38px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ffffff0c;
}

.bubble{
  max-width:850px;
  padding:15px 17px;
  border-radius:17px;
  line-height:1.6;
  overflow-wrap:anywhere;
}

.user .bubble{
  background:linear-gradient(135deg,#7048ff,#4430a8);
}

.ai .bubble{
  background:#12121e;
  border:1px solid #ffffff0c;
}

.bubble pre{
  overflow:auto;
  background:#050509;
  padding:14px;
  border-radius:10px;
  margin:10px 0;
}

.bubble code{
  font-family:monospace;
}

.bubble p{
  margin-bottom:8px;
}

.bubble ul,
.bubble ol{
  padding-left:22px;
}

/* INPUT */

.composerWrap{
  position:fixed;
  bottom:0;
  left:270px;
  right:0;
  padding:15px 20px 20px;
  background:linear-gradient(transparent,#080812 25%);
}

.composer{
  max-width:950px;
  margin:auto;
  display:flex;
  align-items:end;
  gap:8px;
  padding:9px;
  border:1px solid #ffffff18;
  border-radius:18px;
  background:#11111eeF;
  backdrop-filter:blur(20px);
}

#prompt{
  flex:1;
  min-height:45px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:12px;
}

.toolBtn{
  width:43px;
  height:43px;
  border:0;
  border-radius:12px;
  color:#ddd;
  background:#ffffff08;
}

.sendBtn{
  width:48px;
  height:43px;
  border:0;
  border-radius:12px;
  color:white;
  font-weight:bold;
  background:linear-gradient(90deg,#7546ff,#00bde8);
}

.mode{
  position:absolute;
  bottom:92px;
  left:calc(50% - 475px);
  padding:8px 12px;
  border:1px solid #ffffff12;
  border-radius:10px;
  background:#11111e;
  color:#aaa;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:#0009;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modalBox{
  width:100%;
  max-width:500px;
  padding:25px;
  border-radius:20px;
  background:#11111e;
  border:1px solid #ffffff15;
}

.modalBox h2{
  margin-bottom:15px;
}

.modalBox input{
  width:100%;
  padding:13px;
  border:1px solid #ffffff15;
  background:#080812;
  color:white;
  border-radius:10px;
}

.closeBtn{
  float:right;
  background:none;
  color:#aaa;
  border:0;
  font-size:22px;
}

/* RESPONSIVE */

@media(max-width:800px){

  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
  }

  .composerWrap{
    left:0;
  }

  .welcome h1{
    font-size:35px;
  }

  .chat{
    padding-left:12px;
    padding-right:12px;
  }

  .mode{
    left:15px;
    bottom:92px;
  }

  .topbar{
    padding:0 13px;
  }

  .bubble{
    max-width:calc(100vw - 75px);
  }
}
</style>
</head>

<body>

<!-- AUTH -->

<section id="authScreen">

  <div class="authBox">

    <div class="logo">ZenX</div>
    <div class="subtitle">Student AI • 2027</div>

    <div id="loginForm">

      <h2 id="authTitle">Welcome back</h2>

      <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button class="primary" onclick="handleAuth()">
        <span id="authButtonText">Sign In</span>
      </button>

      <button class="linkBtn" onclick="showForgotPassword()">
        Forgot password?
      </button>

      <button class="secondary" onclick="toggleAuth()">
        Create new account
      </button>

      <div id="authMessage" class="authMessage"></div>

    </div>

    <div id="forgotForm" class="hidden">

      <h2>Reset password</h2>

      <input
        id="forgotEmail"
        type="email"
        placeholder="Enter your email"
      >

      <button class="primary" onclick="sendResetEmail()">
        Send Reset Email
      </button>

      <button class="secondary" onclick="hideForgotPassword()">
        Back to Sign In
      </button>

      <div id="forgotMessage" class="authMessage"></div>

    </div>

  </div>

</section>


<!-- APP -->

<section id="appScreen" class="hidden">

  <aside class="sidebar">

    <div class="sideLogo">ZenX AI</div>

    <button class="sideButton" onclick="newChat()">
      ＋ New Chat
    </button>

    <button class="sideButton" onclick="refreshChat()">
      ↻ Refresh
    </button>

    <button class="sideButton" onclick="clearRecents()">
      🗑 Clear Recents
    </button>

    <div class="sectionTitle">
      Recent Chats
    </div>

    <div id="recentList"></div>

    <div class="sectionTitle">
      Student Tools
    </div>

    <button class="sideButton" onclick="quickPrompt('Explain this topic like a Class 11 student')">
      📚 Explain Topic
    </button>

    <button class="sideButton" onclick="quickPrompt('Create a JEE practice quiz for me')">
      📝 JEE Quiz
    </button>

    <button class="sideButton" onclick="quickPrompt('Give me a step-by-step solution')">
      🧮 Solve Problem
    </button>

    <button class="sideButton" onclick="quickPrompt('Make short revision notes')">
      📖 Revision Notes
    </button>

    <button class="sideButton" onclick="logout()">
      🚪 Logout
    </button>

  </aside>


  <main class="main">

    <header class="topbar">

      <div class="topTitle">
        ZenX AI
      </div>

      <div>
        <div id="modeLabel">Student Mode</div>
        <div id="userEmail" class="userEmail"></div>
      </div>

    </header>


    <div id="chat" class="chat">

      <div id="welcome" class="welcome">

        <h1>What can I help you learn?</h1>

        <p>
          Your AI study companion for school, JEE, coding and everyday learning.
        </p>

      </div>

    </div>


    <div class="composerWrap">

      <select id="mode" class="mode" onchange="changeMode()">
        <option value="student">Student</option>
        <option value="jee">JEE</option>
        <option value="school">School</option>
        <option value="coding">Coding</option>
        <option value="general">General</option>
      </select>

      <div class="composer">

        <button class="toolBtn" onclick="startVoice()" title="Voice">
          🎙️
        </button>

        <button class="toolBtn" onclick="showImagePrompt()" title="Generate image">
          🖼️
        </button>

        <textarea
          id="prompt"
          placeholder="Ask ZenX anything..."
          onkeydown="handleEnter(event)"
        ></textarea>

        <button class="toolBtn" onclick="speakLast()" title="Read last answer">
          🔊
        </button>

        <button class="sendBtn" onclick="sendMessage()">
          ➤
        </button>

      </div>

    </div>

  </main>

</section>


<!-- IMAGE MODAL -->

<div id="imageModal" class="modal hidden">

  <div class="modalBox">

    <button class="closeBtn" onclick="closeImagePrompt()">×</button>

    <h2>Generate Image</h2>

    <input
      id="imagePrompt"
      placeholder="Describe the image..."
    >

    <button class="primary" onclick="generateImage()">
      Generate
    </button>

    <div id="imageMessage" class="authMessage"></div>

  </div>

</div>


<script>

/* =========================
   CONFIG
========================= */

const SUPABASE_URL =
"https://srlftvbiqoufejhhfsrh.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNybGZ0dmJpcW91ZmVqaGhmc3JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1OTI0NzAsImV4cCI6MjEwNDE2ODQ3MH0.vJ1CQ-Zz_kaRhDDT5J7y1nssgqccd2zPxQ4_FrJI4fs";

const API_URL =
"https://zenx-hnkl.onrender.com";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================
   STATE
========================= */

let currentUser = null;
let messages = [];
let lastAIAnswer = "";
let currentChatId = null;
let isSignup = false;


/* =========================
   START
========================= */

document.addEventListener("DOMContentLoaded", async () => {

  setupTextarea();

  const {
    data:{
      session
    }
  } = await supabaseClient.auth.getSession();

  if(session){

    currentUser = session.user;

    openApp();

  }else{

    showAuth();

  }

});


supabaseClient.auth.onAuthStateChange(
  async(event,session)=>{

    if(session){

      currentUser = session.user;

      openApp();

    }

  }
);


/* =========================
   AUTH
========================= */

function showAuth(){

  document
    .getElementById("authScreen")
    .classList.remove("hidden");

  document
    .getElementById("appScreen")
    .classList.add("hidden");

}


function toggleAuth(){

  isSignup = !isSignup;

  document
    .getElementById("authTitle")
    .textContent =
    isSignup
    ? "Create your account"
    : "Welcome back";

  document
    .getElementById("authButtonText")
    .textContent =
    isSignup
    ? "Sign Up"
    : "Sign In";

  document
    .querySelector(".secondary")
    .textContent =
    isSignup
    ? "Already have an account?"
    : "Create new account";

  document
    .getElementById("authMessage")
    .textContent = "";

}


async function handleAuth(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("authMessage");

  if(!email || !password){

    message.textContent =
      "Please enter email and password.";

    return;

  }

  message.textContent =
    isSignup
    ? "Creating account..."
    : "Signing in...";


  try{

    if(isSignup){

      const {
        data,
        error
      } =
      await supabaseClient.auth.signUp({
        email,
        password
      });

      if(error) throw error;

      if(data.session){

        currentUser = data.user;

        openApp();

      }else{

        message.textContent =
          "Account created. Check your email for verification.";

      }

    }else{

      const {
        data,
        error
      } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if(error) throw error;

      currentUser = data.user;

      openApp();

    }

  }catch(error){

    message.textContent =
      error.message || "Authentication failed.";

  }

}


function showForgotPassword(){

  document
    .getElementById("loginForm")
    .classList.add("hidden");

  document
    .getElementById("forgotForm")
    .classList.remove("hidden");

}


function hideForgotPassword(){

  document
    .getElementById("forgotForm")
    .classList.add("hidden");

  document
    .getElementById("loginForm")
    .classList.remove("hidden");

}


async function sendResetEmail(){

  const email =
    document
      .getElementById("forgotEmail")
      .value
      .trim();

  const message =
    document.getElementById("forgotMessage");

  if(!email){

    message.textContent =
      "Enter your email.";

    return;

  }

  try{

    const {
      error
    } =
    await supabaseClient.auth.resetPasswordForEmail(
      email,
      {
        redirectTo:
          window.location.origin +
          window.location.pathname
      }
    );

    if(error) throw error;

    message.textContent =
      "Password reset email sent.";

  }catch(error){

    message.textContent =
      error.message;

  }

}


/* =========================
   APP
========================= */

function openApp(){

  document
    .getElementById("authScreen")
    .classList.add("hidden");

  document
    .getElementById("appScreen")
    .classList.remove("hidden");

  document
    .getElementById("userEmail")
    .textContent =
    currentUser?.email || "";

  loadMessages();

}


async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;
  messages = [];

  showAuth();

}


/* =========================
   CHAT
========================= */

function getStorageKey(){

  return currentUser
    ? "zenx_messages_" + currentUser.id
    : "zenx_messages_guest";

}


function saveMessages(){

  try{

    localStorage.setItem(
      getStorageKey(),
      JSON.stringify(messages)
    );

  }catch(error){

    console.error(error);

  }

}


function loadMessages(){

  try{

    const saved =
      localStorage.getItem(
        getStorageKey()
      );

    messages =
      saved
      ? JSON.parse(saved)
      : [];

  }catch(error){

    messages = [];

  }

  renderMessages();
  updateHistory();

}


function renderMessages(){

  const chat =
    document.getElementById("chat");

  chat.innerHTML = "";

  if(messages.length === 0){

    chat.innerHTML = `
      <div id="welcome" class="welcome">
        <h1>What can I help you learn?</h1>
        <p>Your AI study companion for school, JEE, coding and everyday learning.</p>
      </div>
    `;

    return;

  }

  messages.forEach(message=>{

    addMessageToUI(
      message.role,
      message.content,
      false
    );

  });

}


function addMessageToUI(
  role,
  content,
  scroll=true
){

  const chat =
    document.getElementById("chat");

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " +
    (role === "user" ? "user" : "ai");

  const avatar =
    document.createElement("div");

  avatar.className = "avatar";

  avatar.textContent =
    role === "user"
    ? "👤"
    : "Z";

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  if(role === "assistant"){

    bubble.innerHTML =
      marked.parse(content || "");

  }else{

    bubble.textContent =
      content;

  }

  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);

  if(scroll){

    wrapper.scrollIntoView({
      behavior:"smooth",
      block:"end"
    });

  }

}


async function sendMessage(){

  const input =
    document.getElementById("prompt");

  const question =
    input.value.trim();

  if(!question) return;

  input.value = "";

  const welcome =
    document.getElementById("welcome");

  if(welcome) welcome.remove();

  messages.push({
    role:"user",
    content:question
  });

  addMessageToUI(
    "user",
    question
  );

  saveMessages();

  const loading =
    document.createElement("div");

  loading.className =
    "message ai";

  loading.id = "loadingMessage";

  loading.innerHTML = `
    <div class="avatar">Z</div>
    <div class="bubble">ZenX is thinking...</div>
  `;

  document
    .getElementById("chat")
    .appendChild(loading);

  loading.scrollIntoView({
    behavior:"smooth"
  });


  try{

    const response =
      await fetch(
        API_URL + "/api/ask",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            question,

            mode:
              document.getElementById("mode").value,

            history:
              messages.slice(-20),

            user_id:
              currentUser?.id || null

          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.detail ||
        data.error ||
        "AI request failed."
      );

    }


    const answer =
      data.answer ||
      data.response ||
      data.message ||
      "No answer received.";

    lastAIAnswer = answer;


    messages.push({
      role:"assistant",
      content:answer
    });

    saveMessages();

    loading.remove();

    addMessageToUI(
      "assistant",
      answer
    );

    updateHistory();

  }catch(error){

    loading.remove();

    const errorText =
      "Sorry, ZenX could not connect to the AI server. Please try again.";

    messages.push({
      role:"assistant",
      content:errorText
    });

    saveMessages();

    addMessageToUI(
      "assistant",
      errorText
    );

    console.error(error);

  }

}


/* =========================
   CHAT CONTROLS
========================= */

function newChat(){

  messages = [];

  currentChatId =
    Date.now();

  saveMessages();

  renderMessages();

}


function refreshChat(){

  renderMessages();

}


function clearRecents(){

  if(!confirm(
    "Delete all recent chats?"
  )) return;

  messages = [];

  saveMessages();

  renderMessages();

  updateHistory();

}


function updateHistory(){

  const list =
    document.getElementById("recentList");

  list.innerHTML = "";

  if(!messages.length){

    list.innerHTML =
      `<div style="color:#666;font-size:13px;padding:8px">
        No recent chats
      </div>`;

    return;

  }


  const userMessages =
    messages
      .filter(m=>m.role==="user")
      .slice(-10)
      .reverse();


  userMessages.forEach(
    (message,index)=>{

      const row =
        document.createElement("div");

      row.className =
        "recent";

      const button =
        document.createElement("button");

      button.textContent =
        message.content;

      button.onclick = ()=>{

        document
          .getElementById("prompt")
          .value =
          message.content;

      };


      const del =
        document.createElement("button");

      del.className =
        "deleteRecent";

      del.textContent = "×";

      del.onclick = (event)=>{

        event.stopPropagation();

        const actualIndex =
          messages.lastIndexOf(message);

        if(actualIndex >= 0){

          messages.splice(
            actualIndex,
            1
          );

          saveMessages();

          renderMessages();

          updateHistory();

        }

      };


      row.appendChild(button);
      row.appendChild(del);

      list.appendChild(row);

    }
  );

}


function quickPrompt(text){

  document
    .getElementById("prompt")
    .value = text;

  document
    .getElementById("prompt")
    .focus();

}


/* =========================
   MODE
========================= */

function changeMode(){

  const mode =
    document.getElementById("mode").value;

  const labels = {
    student:"Student Mode",
    jee:"JEE Mode",
    school:"School Mode",
    coding:"Coding Mode",
    general:"General Mode"
  };

  document
    .getElementById("modeLabel")
    .textContent =
    labels[mode] || "Student Mode";

}


/* =========================
   VOICE
========================= */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "Voice recognition is not supported in this browser."
    );

    return;

  }

  const recognition =
    new SpeechRecognition();

  recognition.lang = "en-IN";

  recognition.interimResults = false;

  recognition.maxAlternatives = 1;

  recognition.start();


  recognition.onresult =
    event=>{

      const text =
        event.results[0][0].transcript;

      document
        .getElementById("prompt")
        .value = text;

    };


  recognition.onerror =
    error=>{

      console.error(
        "Voice error:",
        error
      );

    };

}


function speakLast(){

  if(!lastAIAnswer){

    alert(
      "There is no AI answer to read yet."
    );

    return;

  }

  if(!window.speechSynthesis){

    alert(
      "Text-to-speech is not supported."
    );

    return;

  }

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(
      lastAIAnswer
    );

  utterance.lang = "en-IN";

  utterance.rate = 0.95;

  window.speechSynthesis.speak(
    utterance
  );

}


/* =========================
   IMAGE GENERATION
========================= */

function showImagePrompt(){

  document
    .getElementById("imageModal")
    .classList.remove("hidden");

}


function closeImagePrompt(){

  document
    .getElementById("imageModal")
    .classList.add("hidden");

}


async function generateImage(){

  const prompt =
    document
      .getElementById("imagePrompt")
      .value
      .trim();

  const message =
    document
      .getElementById("imageMessage");

  if(!prompt){

    message.textContent =
      "Describe the image first.";

    return;

  }

  message.textContent =
    "Generating image...";


  try{

    const response =
      await fetch(
        API_URL + "/api/image",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            prompt,

            user_id:
              currentUser?.id || null

          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.detail ||
        data.error ||
        "Image generation failed."
      );

    }


    const imageUrl =
      data.image_url ||
      data.url;


    if(!imageUrl){

      throw new Error(
        "No image was returned by the server."
      );

    }


    closeImagePrompt();

    const chat =
      document.getElementById("chat");

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message ai";

    wrapper.innerHTML = `
      <div class="avatar">Z</div>
      <div class="bubble">
        <p>Generated image:</p>
        <img
          src="${imageUrl}"
          alt="Generated by ZenX"
          style="max-width:100%;border-radius:15px;margin-top:10px;"
        >
      </div>
    `;

    chat.appendChild(wrapper);

    wrapper.scrollIntoView({
      behavior:"smooth"
    });


  }catch(error){

    message.textContent =
      error.message ||
      "Image generation failed.";

    console.error(error);

  }

}


/* =========================
   ENTER KEY
========================= */

function handleEnter(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

}


function setupTextarea(){

  const textarea =
    document.getElementById("prompt");

  textarea.addEventListener(
    "input",
    ()=>{
      textarea.style.height =
        "auto";

      textarea.style.height =
        Math.min(
          textarea.scrollHeight,
          150
        ) + "px";
    }
  );

}


/* =========================
   GLOBAL ERROR HANDLING
========================= */

window.addEventListener(
  "unhandledrejection",
  event=>{

    console.error(
      "Unhandled error:",
      event.reason
    );

  }
);
